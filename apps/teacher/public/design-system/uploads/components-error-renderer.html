<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Error renderer</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .panel { background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 12px; padding: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }
  .stack { font-family: var(--font-math); font-size: 30px; font-weight: 600; line-height: 1.15; text-align: right; }
  .stack .digit { padding: 0 6px; border-radius: 6px; }
  .diverge { background: rgba(216,96,96,.18); color: #5A1F1F; }
  hr { border: 0; border-top: 2px solid var(--fg-1); margin: 4px 0; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(122,79,0,.12); padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--error-fg); }
  .msg { color: var(--error-fg); font-size: 14px; line-height: 1.55; margin-top: 12px; }
</style></head>
<body>
  <div class="panel">
    <span class="tag">Error · Borrow omitido en decenas</span>
    <div class="row" style="margin-top:14px">
      <div>
        <div class="t-caption" style="margin-bottom:6px">Tu respuesta</div>
        <div class="stack math">
          <div>5&nbsp;3</div>
          <div>−&nbsp;2&nbsp;6</div>
          <hr/>
          <div><span class="digit diverge">3</span>&nbsp;<span class="digit diverge">3</span></div>
        </div>
      </div>
      <div>
        <div class="t-caption" style="margin-bottom:6px">Solución correcta</div>
        <div class="stack math">
          <div><sup style="font-size:14px;color:var(--mint-700);font-weight:700">4&sup1;</sup>5&nbsp;3</div>
          <div>−&nbsp;2&nbsp;6</div>
          <hr/>
          <div>2&nbsp;7</div>
        </div>
      </div>
    </div>
    <p class="msg">Mira la columna de las decenas. Como 6 es mayor que 3, le pedimos prestado: el 5 se vuelve 4 y el 3 pasa a 13. Inténtalo de nuevo.</p>
  </div>
</body></html>
