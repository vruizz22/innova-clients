<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperProfes · OCR Upload Flow</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<style>
  body { margin:0; background:var(--slate-50); font-family:var(--font-sans); }
  .ocr-shell { max-width:1280px; margin:0 auto; padding:28px 24px; }
  .ocr-title { font-size:20px; font-weight:700; margin:0 0 8px; letter-spacing:-.01em; }
  .ocr-sub { font-size:14px; color:var(--fg-2); margin:0 0 32px; }
  
  .ocr-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  
  /* ── UPLOAD CARD ── */
  .ocr-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:32px; }
  
  .upload-zone { border:2px dashed var(--sky-300); border-radius:14px; padding:40px 24px; text-align:center; background:var(--sky-50); cursor:pointer; transition:all .2s; }
  .upload-zone:hover { border-color:var(--sky-500); background:var(--sky-100); }
  .upload-zone.drag { border-color:var(--sky-600); background:var(--sky-100); box-shadow:0 4px 16px rgba(63,167,214,.15); }
  .upload-ico { font-size:48px; margin-bottom:12px; }
  .upload-text { font-size:15px; font-weight:600; color:var(--sky-900); margin:0 0 4px; }
  .upload-sub { font-size:13px; color:var(--fg-2); }
  
  .file-input { display:none; }
  
  /* ── PREVIEW ── */
  .preview-box { margin-top:24px; display:none; }
  .preview-box.show { display:block; }
  .preview-img { width:100%; max-height:300px; object-fit:contain; border-radius:12px; background:var(--slate-100); border:1px solid var(--border); }
  .preview-actions { display:flex; gap:10px; margin-top:12px; }
  .btn { padding:10px 16px; border-radius:10px; border:1.5px solid var(--border); background:#fff; font:inherit; font-weight:600; font-size:14px; cursor:pointer; transition:all .15s; }
  .btn:hover { background:var(--slate-50); }
  .btn-danger { color:var(--mastery-weak); border-color:var(--mastery-weak); }
  .btn-primary { background:var(--sky-500); color:#fff; border-color:var(--sky-500); }
  .btn-primary:hover { background:var(--sky-600); }
  
  /* ── EXTRACTION RESULTS ── */
  .extraction-box { margin-top:24px; display:none; background:var(--mint-50); border:1px solid var(--mint-200); border-radius:12px; padding:20px; }
  .extraction-box.show { display:block; }
  .extraction-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--mint-700); margin:0 0 14px; }
  .extraction-items { display:flex; flex-direction:column; gap:10px; }
  .extraction-item { display:flex; align-items:center; gap:12px; padding:10px 12px; background:#fff; border-radius:10px; border:1px solid var(--mint-200); }
  .extraction-item .ico { width:32px; height:32px; border-radius:8px; background:var(--mint-100); display:grid; place-items:center; color:var(--mint-700); font-weight:700; font-size:13px; flex-shrink:0; }
  .extraction-item .txt { flex:1; }
  .extraction-item .problem { font-weight:600; font-family:ui-monospace,monospace; }
  .extraction-item .answer { font-size:12px; color:var(--fg-2); }
  .extraction-confirm { margin-top:14px; display:flex; gap:8px; }
  .extraction-confirm button { flex:1; }
  
  /* ── FLOW STEPS ── */
  .flow-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .step-num { width:36px; height:36px; border-radius:9999px; background:var(--sky-500); color:#fff; display:grid; place-items:center; font-weight:700; font-size:16px; flex-shrink:0; }
  .step-label { font-size:14px; font-weight:700; color:var(--fg-1); }
  .step-desc { font-size:12px; color:var(--fg-2); }
  
  /* Mobile frame */
  .mobile-frame { background:#000; border-radius:40px; padding:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); aspect-ratio:9/19.5; overflow:hidden; display:flex; flex-direction:column; }
  .mobile-status { height:28px; background:linear-gradient(90deg,#000 0%,#000 85%,#333 100%); border-radius:0 0 20px 20px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:11px; color:#fff; font-weight:600; }
  .mobile-content { flex:1; background:var(--bg-student); overflow-y:auto; display:flex; flex-direction:column; border-radius:32px; }
  .mobile-safe { padding:16px; flex:1; overflow-y:auto; }
  
  .progress-bar { height:4px; background:var(--slate-200); border-radius:9999px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:var(--sky-500); border-radius:9999px; transition:width .3s; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel">
const { useState } = React;

const MOCK_EXTRACTION = [
  {problem:'47 − 18', answer:29},
  {problem:'52 − 24', answer:28},
  {problem:'63 − 35', answer:28},
  {problem:'71 − 43', answer:28},
  {problem:'80 − 52', answer:28},
];

function WebFlow() {
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [extracted, setExtracted] = useState(false);
  const [step, setStep] = useState(1);
  
  const onFileSelect = (f) => {
    setFile(f);
    const reader = new FileReader();
    reader.onload = (e) => setPreview(e.target.result);
    reader.readAsDataURL(f);
  };
  
  const onUpload = (e) => {
    const f = e.target.files?.[0];
    if(f) onFileSelect(f);
  };
  
  const onExtract = () => {
    setStep(2);
    setTimeout(() => setExtracted(true), 800);
  };
  
  const onConfirm = () => {
    setStep(3);
    alert('POST /attempts/ocr-extract → 5 intentos creados');
  };
  
  return (
    <>
      <div className="ocr-card">
        <div className="flow-header">
          <div className="step-num">1</div>
          <div><div className="step-label">Sube la hoja de ejercicios</div><div className="step-desc">Foto clara, sin sombras</div></div>
        </div>
        <div className="upload-zone">
          <div className="upload-ico">📸</div>
          <div className="upload-text">Arrastra la foto aquí</div>
          <div className="upload-sub">o haz click para seleccionar</div>
          <input type="file" accept="image/*" className="file-input" onChange={onUpload}/>
        </div>
        {preview && (
          <div className="preview-box show">
            <img src={preview} className="preview-img" alt="uploaded"/>
            <div className="preview-actions">
              <button className="btn btn-danger" onClick={()=>{setFile(null);setPreview(null);}}>Cambiar</button>
              <button className="btn btn-primary" onClick={onExtract}>Extraer con OCR</button>
            </div>
          </div>
        )}
      </div>
      
      {step >= 2 && (
        <div className="ocr-card">
          <div className="flow-header">
            <div className="step-num">2</div>
            <div><div className="step-label">Revisa los ejercicios extraídos</div><div className="step-desc">Corrige si es necesario</div></div>
          </div>
          {extracted && (
            <div className="extraction-box show">
              <div className="extraction-title">✓ 5 ejercicios detectados · Resta con reagrupación</div>
              <div className="extraction-items">
                {MOCK_EXTRACTION.map((e,i) => (
                  <div key={i} className="extraction-item">
                    <div className="ico">{i+1}</div>
                    <div className="txt">
                      <div className="problem">{e.problem}</div>
                      <div className="answer">Tu respuesta: {e.answer}</div>
                    </div>
                    <button className="btn" style={{padding:'6px 12px',fontSize:'12px'}}>Editar</button>
                  </div>
                ))}
              </div>
              <div className="extraction-confirm">
                <button className="btn">← Volver</button>
                <button className="btn btn-primary" onClick={onConfirm}>Confirmar y enviar</button>
              </div>
            </div>
          )}
        </div>
      )}
      
      {step >= 3 && (
        <div className="ocr-card">
          <div className="flow-header">
            <div className="step-num">3</div>
            <div><div className="step-label">¡Listo!</div><div className="step-desc">5 intentos guardados y analizados</div></div>
          </div>
          <div style={{background:'var(--mint-50)',border:'1px solid var(--mint-200)',borderRadius:12,padding:20,textAlign:'center'}}>
            <div style={{fontSize:28}}>🎉</div>
            <div style={{fontWeight:700,fontSize:16,color:'var(--mint-900)',marginTop:12}}>Práctica registrada</div>
            <div style={{color:'var(--mint-800)',fontSize:14,marginTop:8}}>El profesor ya está viendo tu progreso en Resta con reagrupación.</div>
            <button className="btn btn-primary" style={{width:'100%',marginTop:16}}>Ver mi progreso →</button>
          </div>
        </div>
      )}
    </>
  );
}

function MobileFlow() {
  const [step, setStep] = useState(1);
  const [file, setFile] = useState(null);
  
  const onCapture = () => {
    setStep(2);
    setFile(true);
  };
  
  const onExtract = () => {
    setStep(3);
  };
  
  const onConfirm = () => {
    setStep(4);
  };
  
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
      <div className="mobile-frame">
        <div className="mobile-status">
          <span>9:41</span>
          <span>📶 📡 🔋</span>
        </div>
        <div className="mobile-content">
          <div className="mobile-safe">
            {step === 1 && (
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div style={{fontSize:18,fontWeight:700,color:'var(--fg-1)'}}>Escanear ejercicios</div>
                <div style={{fontSize:13,color:'var(--fg-2)',lineHeight:1.6}}>Toma una foto clara de tu hoja de ejercicios. El sistema detectará automáticamente los problemas.</div>
                <div style={{flex:1,minHeight:240,background:'linear-gradient(135deg,var(--sky-100),var(--mint-50))',borderRadius:14,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12}}>
                  <div style={{fontSize:48}}>📷</div>
                  <button className="btn btn-primary" onClick={onCapture} style={{width:'80%'}}>Abrir cámara</button>
                </div>
              </div>
            )}
            
            {step === 2 && (
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div style={{fontSize:18,fontWeight:700,color:'var(--fg-1)'}}>Foto capturada</div>
                <div style={{background:'var(--slate-200)',borderRadius:12,height:160,display:'grid',placeItems:'center',color:'var(--fg-2)',fontSize:12}}>Foto simulada</div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn" style={{flex:1}} onClick={()=>setStep(1)}>← Retomar</button>
                  <button className="btn btn-primary" style={{flex:1}} onClick={onExtract}>Analizar →</button>
                </div>
              </div>
            )}
            
            {step === 3 && (
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <div style={{fontSize:18,fontWeight:700,color:'var(--fg-1)'}}>Ejercicios detectados</div>
                <div className="progress-bar"><div className="progress-fill" style={{width:'100%'}}/></div>
                {[{p:'47 − 18',a:29},{p:'52 − 24',a:28}].map((e,i)=>(
                  <div key={i} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,padding:12,display:'flex',alignItems:'center',gap:12}}>
                    <div style={{width:28,height:28,borderRadius:8,background:'var(--sky-100)',color:'var(--sky-700)',display:'grid',placeItems:'center',fontSize:12,fontWeight:700}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'ui-monospace,monospace',fontWeight:700}}>{e.p}</div>
                      <div style={{fontSize:12,color:'var(--fg-2)'}}>Respuesta: {e.a}</div>
                    </div>
                  </div>
                ))}
                <div style={{display:'flex',gap:8,marginTop:8}}>
                  <button className="btn" style={{flex:1}}>← Atrás</button>
                  <button className="btn btn-primary" style={{flex:1}} onClick={onConfirm}>Confirmar ✓</button>
                </div>
              </div>
            )}
            
            {step === 4 && (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,minHeight:320}}>
                <div style={{fontSize:40}}>🎉</div>
                <div style={{fontSize:16,fontWeight:700,textAlign:'center'}}>¡Listo!</div>
                <div style={{fontSize:13,color:'var(--fg-2)',textAlign:'center',lineHeight:1.5}}>5 ejercicios guardados y analizados por el sistema.</div>
                <div style={{width:'100%',height:1,background:'var(--border)',margin:'8px 0'}}/>
                <div style={{fontSize:12,color:'var(--fg-2)',textAlign:'center'}}>Tu profe ya está viendo tu progreso.</div>
                <button className="btn btn-primary" style={{width:'100%',marginTop:8}}>Ver progreso →</button>
              </div>
            )}
          </div>
        </div>
      </div>
      <div style={{fontSize:11,color:'var(--fg-2)'}}>Mobile · Expo iOS/Android</div>
    </div>
  );
}

function App() {
  return (
    <div className="ocr-shell" data-screen-label="OCR Upload flow">
      <h1 className="ocr-title">OCR Upload Flow · POST /attempts/ocr-extract</h1>
      <p className="ocr-sub">Captura de hoja → extracción de ejercicios → confirmación → análisis por Gemini 2.0 Flash</p>
      <div className="ocr-grid">
        <WebFlow/>
        <MobileFlow/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
