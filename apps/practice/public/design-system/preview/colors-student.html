<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Colors — Student</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { border-radius: 8px; padding: 12px; height: 76px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border); }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .8; }
  .label { font-size: 12px; font-weight: 600; color: var(--fg-2); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .group + .group { margin-top: 16px; }
</style></head>
<body>
  <div class="group">
    <div class="label">Sky · primary action</div>
    <div class="row">
      <div class="swatch" style="background:#F0F7FB;color:#0F2A3D"><span class="name">sky-50</span><span class="hex">#F0F7FB</span></div>
      <div class="swatch" style="background:#DCEDF6;color:#0F2A3D"><span class="name">sky-100</span><span class="hex">#DCEDF6</span></div>
      <div class="swatch" style="background:#84C2DD;color:#0F2A3D"><span class="name">sky-300</span><span class="hex">#84C2DD</span></div>
      <div class="swatch" style="background:#3FA7D6;color:#fff"><span class="name">sky-500</span><span class="hex">#3FA7D6</span></div>
      <div class="swatch" style="background:#18506D;color:#fff"><span class="name">sky-800</span><span class="hex">#18506D</span></div>
    </div>
  </div>
  <div class="group">
    <div class="label">Mint · mastery green / accent</div>
    <div class="row">
      <div class="swatch" style="background:#ECFAF3;color:#194E34"><span class="name">mint-50</span><span class="hex">#ECFAF3</span></div>
      <div class="swatch" style="background:#D2F2E0;color:#194E34"><span class="name">mint-100</span><span class="hex">#D2F2E0</span></div>
      <div class="swatch" style="background:#76D29F;color:#0F3322"><span class="name">mint-300</span><span class="hex">#76D29F</span></div>
      <div class="swatch" style="background:#3DAA72;color:#fff"><span class="name">mint-500</span><span class="hex">#3DAA72</span></div>
      <div class="swatch" style="background:#194E34;color:#fff"><span class="name">mint-800</span><span class="hex">#194E34</span></div>
    </div>
  </div>
</body></html>
