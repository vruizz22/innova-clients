<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { padding: 18px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; height: 88px; position: relative; }
  .light { background: #fff; }
  .dark { background: var(--slate-800); border-color: var(--slate-700); }
  .sky { background: var(--bg-student); border-color: #B6DBED; }
  .mint { background: var(--bg-parent); border-color: #A8E5C2; }
  .tag { position: absolute; top: 8px; left: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; color: var(--fg-2); }
  .dark .tag { color: rgba(255,255,255,.6); }
  .row-mark { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
  .row-mark .panel { height: 80px; flex: 1; }
</style></head>
<body>
  <div class="grid">
    <div class="panel light"><span class="tag">Light</span><img src="../assets/superprofes-logo.svg" width="220" alt="SuperProfes"/></div>
    <div class="panel dark"><span class="tag">Dark</span><img src="../assets/superprofes-logo-inverse.svg" width="220" alt="SuperProfes"/></div>
  </div>
  <div class="row-mark">
    <div class="panel sky"><span class="tag">Mark · sky</span><img src="../assets/superprofes-mark.svg" width="48" alt="mark"/></div>
    <div class="panel mint"><span class="tag">Mark · mint</span><img src="../assets/superprofes-mark.svg" width="48" alt="mark"/></div>
    <div class="panel light"><span class="tag">Mark · neutral</span><img src="../assets/superprofes-mark.svg" width="48" alt="mark"/></div>
  </div>
  <p class="t-caption" style="margin-top:14px">Wordmark: Inter 700 · −0.025em · "Super" in slate-900, "Profes" in sky-500. Stacked-bar mark suggests worksheet rows / progress.</p>
</body></html>
