<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Math keypad</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-student); }
  .keypad { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; padding: 16px; background: #fff; border-radius: 16px; box-shadow: var(--shadow-card); width: max-content; }
  .key { width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--border); background: #fff; font-family: var(--font-math); font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .key.op { background: var(--sky-50); color: var(--sky-800); }
  .key.go { background: var(--primary); color: #fff; border-color: var(--primary); grid-column: span 2; width: auto; }
  .label { font-size: 11px; color: var(--fg-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .stack { display: flex; gap: 24px; align-items: flex-start; }
  .display { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-width: 180px; }
  .display .v { font-family: var(--font-math); font-size: 32px; font-weight: 600; text-align: right; }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="label">Display</div>
      <div class="display">
        <div class="t-caption">Paso 2 de 3</div>
        <div class="v math">53 − 26</div>
      </div>
    </div>
    <div>
      <div class="label">Keypad · 56px keys</div>
      <div class="keypad">
        <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key op">⌫</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key op">−</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key op">+</button>
        <button class="key">0</button><button class="key">,</button><button class="key go">Listo</button>
      </div>
    </div>
  </div>
</body></html>
