<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Colors — Teacher / Slate</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { border-radius: 8px; padding: 12px; height: 76px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border); }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .85; }
  .label { font-size: 12px; font-weight: 600; color: var(--fg-2); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
</style></head>
<body>
  <div class="label">Slate · teacher / parent dashboards</div>
  <div class="row">
    <div class="swatch" style="background:#F7F8FA;color:#1F2937"><span class="name">slate-50</span><span class="hex">#F7F8FA</span></div>
    <div class="swatch" style="background:#E5E9F0;color:#1F2937"><span class="name">slate-100</span><span class="hex">#E5E9F0</span></div>
    <div class="swatch" style="background:#A5ADBC;color:#0F141B"><span class="name">slate-300</span><span class="hex">#A5ADBC</span></div>
    <div class="swatch" style="background:#4F5868;color:#fff"><span class="name">slate-500</span><span class="hex">#4F5868</span></div>
    <div class="swatch" style="background:#1F2937;color:#fff"><span class="name">slate-800</span><span class="hex">#1F2937</span></div>
  </div>
  <p style="margin-top:14px;font-size:13px;color:var(--fg-2);max-width:60ch;line-height:1.5">
    Slate grounds teacher and parent dashboards. The accent stays neutral so data — heatmaps, charts, badges — is the visual hero.
  </p>
</body></html>
