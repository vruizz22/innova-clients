name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      # apps/web is scaffolded in M9; keep tolerant until it lands.
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api.superprofes.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: pnpm --filter @innova/web... build
        continue-on-error: true

      # Playwright smoke vs SuperProfes-Design-System/preview baselines.
      # Wired in M9 — see docs/SMOKE_TESTING.md.
      # - name: Playwright smoke
      #   run: pnpm --filter @innova/web exec playwright test --reporter=github
