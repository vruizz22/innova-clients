name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Build, lint, and test monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy design system assets
        run: |
          node scripts/copy-design-system-to-public.js landing/public/design-system
          node scripts/copy-design-system-to-public.js apps/practice/public/design-system
          node scripts/copy-design-system-to-public.js apps/teacher/public/design-system

      - name: Build landing
        run: pnpm --filter superprofes-landing build

      - name: Build practice
        env:
          NEXT_PUBLIC_API_URL: https://api.superprofes.app
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID || 'placeholder' }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID || 'placeholder' }}
        run: pnpm --filter @innova/practice build

      - name: Build teacher
        env:
          NEXT_PUBLIC_API_URL: https://api.superprofes.app
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID || 'placeholder' }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID || 'placeholder' }}
        run: pnpm --filter @innova/teacher build

      - name: TypeCheck mobile
        run: pnpm --filter @innova/mobile exec tsc --noEmit
        continue-on-error: true

      - name: Unit tests
        run: pnpm test:unit
        continue-on-error: true
