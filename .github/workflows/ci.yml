name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type check · Lint · Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
      NEXT_PUBLIC_COGNITO_CLIENT_ID: testclientid
      NEXT_PUBLIC_S3_UPLOAD_BUCKET: innova-uploads-test
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_COGNITO_CLIENT_ID: testclientid

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages + apps)
        run: pnpm -r run type-check

      - name: Lint (all packages + apps)
        run: pnpm -r run lint

      - name: Unit tests with coverage
        run: pnpm -r run test --coverage --reporter=verbose

      - name: Assert coverage ≥75% (packages only)
        run: pnpm --filter "./packages/**" run test --coverage --coverageThreshold='{"global":{"lines":75}}'

      - name: Build all apps (verify no build errors)
        run: pnpm -r run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage/"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter apps/teacher exec playwright install --with-deps chromium

      - name: Run E2E tests (teacher dashboard)
        run: pnpm --filter apps/teacher run test:e2e
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.STAGING_COGNITO_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.STAGING_COGNITO_CLIENT_ID }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/teacher/playwright-report/
