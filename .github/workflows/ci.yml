name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Now gating: front reports tsc 0 errors locally (R5+). If this turns
      # red it is a real type error to fix, not pipeline tolerance.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      # TODO(R9): drop `continue-on-error` once the web build is verified to be stable and CI
      # is green after the (guides) route-group fix. Until then keep tolerant
      # so CI does not block on the unverified production build.
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api.superprofes.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: pnpm --filter @innova/web... build
        continue-on-error: true

      # Playwright smoke vs SuperProfes-Design-System/preview baselines.
      # Wired in M9 — see docs/SMOKE_TESTING.md.
      # - name: Playwright smoke
      #   run: pnpm --filter @innova/web exec playwright test --reporter=github
