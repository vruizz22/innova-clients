name: Deploy Landing to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy superprofes.app
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy design system
        run: node scripts/copy-design-system-to-public.js landing/public/design-system

      - name: Build landing
        working-directory: landing
        env:
          PUBLIC_PRACTICE_URL: https://practice.superprofes.app
          PUBLIC_TEACHER_URL: https://profe.superprofes.app
          PUBLIC_PARENT_URL: https://apoderado.superprofes.app
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets to S3 (immutable cache)
        run: |
          aws s3 sync landing/dist s3://$S3_BUCKET_NAME \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML to S3 (no-cache)
        run: |
          aws s3 sync landing/dist s3://$S3_BUCKET_NAME \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
