name: Expo EAS Build (mobile)
# EAS_TOKEN = Account Access Token from expo.dev/accounts/[account]/settings/access-tokens
# NOT the projectId (e1d3ad8c-...) — that lives in app.config.ts extra.eas.projectId

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: EAS Build iOS + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build with EAS (both platforms)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_COGNITO_CLIENT_ID }}
          EXPO_PUBLIC_COGNITO_REGION: ${{ secrets.EXPO_PUBLIC_COGNITO_REGION }}
        run: eas build --profile production --platform all --non-interactive

  # EAS Workflow alternative — uses eas.yml workflow file
