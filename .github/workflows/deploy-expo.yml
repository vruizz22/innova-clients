name: Expo EAS Build (mobile)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: EAS Build iOS + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        # EAS_TOKEN must be an Account Access Token from:
        # expo.dev/accounts/[your-account]/settings/access-tokens
        # This is NOT the projectId (found in app.config.ts as extra.eas.projectId).
        # Generate a token with "publish" scope at minimum for EAS Build + Update.
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build with EAS
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_COGNITO_CLIENT_ID }}
        run: eas build --profile production --platform all --non-interactive
