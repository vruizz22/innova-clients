name: Deploy Next.js Apps to Vercel

on:
    push:
        branches: [ main ]
    workflow_dispatch:

jobs:
    deploy-practice:
        runs-on: ubuntu-latest
        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRACTICE }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRACTICE }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy practice
              working-directory: innova-clients/apps/practice
              run: |
                  mkdir -p .vercel
                  printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
                  npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
                  npx vercel build --prod --token "$VERCEL_TOKEN"
                  npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

    deploy-teacher:
        runs-on: ubuntu-latest
        needs: deploy-practice
        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TEACHER }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEACHER }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy teacher
              working-directory: innova-clients/apps/teacher
              run: |
                  mkdir -p .vercel
                  printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
                  npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
                  npx vercel build --prod --token "$VERCEL_TOKEN"
                  npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
