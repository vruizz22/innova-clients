name: Deploy Next.js Apps to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-practice:
    name: Deploy practice.superprofes.app
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRACTICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy design system
        run: node scripts/copy-design-system-to-public.js apps/practice/public/design-system

      - name: Deploy practice to Vercel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_LANDING_URL: ${{ secrets.NEXT_PUBLIC_LANDING_URL }}
          NEXT_PUBLIC_PRACTICE_URL: ${{ secrets.NEXT_PUBLIC_PRACTICE_URL }}
          NEXT_PUBLIC_TEACHER_URL: ${{ secrets.NEXT_PUBLIC_TEACHER_URL }}
          NEXT_PUBLIC_PARENT_URL: ${{ secrets.NEXT_PUBLIC_PARENT_URL }}
        run: |
          mkdir -p apps/practice/.vercel
          # Write project.json WITHOUT rootDirectory to avoid path duplication
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > apps/practice/.vercel/project.json
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --cwd apps/practice
          # Patch: remove rootDirectory from pulled settings if set (prevents apps/practice/apps/practice duplication)
          node -e "
            const fs=require('fs');
            const p='apps/practice/.vercel/project.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            delete j.rootDirectory;
            fs.writeFileSync(p,JSON.stringify(j));
          "
          npx vercel build --prod --token "$VERCEL_TOKEN" --cwd apps/practice
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --cwd apps/practice

  deploy-teacher:
    name: Deploy profe.superprofes.app
    runs-on: ubuntu-latest
    needs: deploy-practice
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEACHER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy design system
        run: node scripts/copy-design-system-to-public.js apps/teacher/public/design-system

      - name: Deploy teacher to Vercel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_LANDING_URL: ${{ secrets.NEXT_PUBLIC_LANDING_URL }}
          NEXT_PUBLIC_PRACTICE_URL: ${{ secrets.NEXT_PUBLIC_PRACTICE_URL }}
          NEXT_PUBLIC_TEACHER_URL: ${{ secrets.NEXT_PUBLIC_TEACHER_URL }}
          NEXT_PUBLIC_PARENT_URL: ${{ secrets.NEXT_PUBLIC_PARENT_URL }}
        run: |
          mkdir -p apps/teacher/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > apps/teacher/.vercel/project.json
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --cwd apps/teacher
          node -e "
            const fs=require('fs');
            const p='apps/teacher/.vercel/project.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            delete j.rootDirectory;
            fs.writeFileSync(p,JSON.stringify(j));
          "
          npx vercel build --prod --token "$VERCEL_TOKEN" --cwd apps/teacher
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --cwd apps/teacher

  deploy-parent:
    name: Deploy padres.superprofes.app
    runs-on: ubuntu-latest
    needs: deploy-teacher
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PARENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy design system
        run: node scripts/copy-design-system-to-public.js apps/parent/public/design-system

      - name: Deploy parent to Vercel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_LANDING_URL: ${{ secrets.NEXT_PUBLIC_LANDING_URL }}
          NEXT_PUBLIC_PRACTICE_URL: ${{ secrets.NEXT_PUBLIC_PRACTICE_URL }}
          NEXT_PUBLIC_TEACHER_URL: ${{ secrets.NEXT_PUBLIC_TEACHER_URL }}
          NEXT_PUBLIC_PARENT_URL: ${{ secrets.NEXT_PUBLIC_PARENT_URL }}
        run: |
          mkdir -p apps/parent/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > apps/parent/.vercel/project.json
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --cwd apps/parent
          node -e "
            const fs=require('fs');
            const p='apps/parent/.vercel/project.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            delete j.rootDirectory;
            fs.writeFileSync(p,JSON.stringify(j));
          "
          npx vercel build --prod --token "$VERCEL_TOKEN" --cwd apps/parent
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --cwd apps/parent
