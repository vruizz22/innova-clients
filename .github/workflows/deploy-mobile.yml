name: EAS Build (mobile)
# PARKED until the native apps land: `apps/mobile-student` and
# `apps/mobile-parent` do NOT exist in the monorepo yet (only `apps/web`),
# so a `mobile-v*` tag push would fail the matrix. Manual-only for now.
# Re-enable the tag trigger once the Expo apps are scaffolded.
# EAS_TOKEN = Account Access Token from expo.dev.

on:
  # push:
  #   tags: ["mobile-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile-student, mobile-parent]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: EAS Build (iOS + Android)
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: eas build --profile production --platform all --non-interactive
