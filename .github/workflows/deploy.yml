name: Deploy Innova Clients

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Download InterVariable.woff2
              run: |
                  mkdir -p SuperProfes-Design-System/fonts
                  curl -L "https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHAPUxCKVtQZA.woff2" \
                    -o SuperProfes-Design-System/fonts/InterVariable.woff2 || true
              continue-on-error: true

            - name: Generate OpenAPI TypeScript client
              run: |
                  npx @openapitools/openapi-generator-cli generate -i https://raw.githubusercontent.com/vruizz22/innova-backend-serverless/main/docs/openapi.json -g typescript-axios -o packages/api-client || true

            - name: Type check
              run: pnpm run type-check || true

            - name: Lint
              run: pnpm lint || true

            - name: Run tests
              run: pnpm test || true

            - name: Build
              run: pnpm build

    deploy-vercel-practice:
        name: Deploy practice app to Vercel
        needs: test-and-build
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy practice to Vercel
              uses: amondnet/vercel-action@v20
              if: env.VERCEL_TOKEN_PRACTICE != ''
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN_PRACTICE }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRACTICE }}
                  working-directory: ./apps/practice
              env:
                  VERCEL_TOKEN_PRACTICE: ${{ secrets.VERCEL_TOKEN_PRACTICE }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
                  NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}

    deploy-vercel-teacher:
        name: Deploy teacher app to Vercel
        needs: test-and-build
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy teacher to Vercel
              uses: amondnet/vercel-action@v20
              if: env.VERCEL_TOKEN_TEACHER != ''
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN_TEACHER }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_TEACHER }}
                  working-directory: ./apps/teacher
              env:
                  VERCEL_TOKEN_TEACHER: ${{ secrets.VERCEL_TOKEN_TEACHER }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
                  NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}

    deploy-cloudflare-landing:
        name: Deploy landing to Cloudflare Pages
        needs: test-and-build
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@v4

            - name: Deploy landing to Cloudflare Pages
              if: env.CF_API_TOKEN != ''
              run: |
                  npm install -g wrangler
                  cd landing
                  wrangler pages deploy . --project-name=${{ secrets.CF_PAGES_PROJECT_LANDING }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
                  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
