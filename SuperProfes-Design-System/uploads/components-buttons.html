<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; }
  .label { width: 80px; font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
</style></head>
<body>
  <div class="row">
    <span class="label">Default</span>
    <button class="btn btn-primary">Asignar práctica</button>
    <button class="btn btn-secondary">Ver detalle</button>
    <button class="btn btn-ghost">Cancelar</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>
  <div class="row">
    <span class="label">Hover</span>
    <button class="btn btn-primary" style="background:var(--primary-hover)">Asignar práctica</button>
    <button class="btn btn-secondary" style="background:var(--slate-50)">Ver detalle</button>
    <button class="btn btn-ghost" style="background:var(--slate-50)">Cancelar</button>
  </div>
  <div class="row">
    <span class="label">Press</span>
    <button class="btn btn-primary" style="background:var(--primary-press);transform:scale(.98)">Asignar práctica</button>
    <button class="btn btn-secondary" style="transform:scale(.98)">Ver detalle</button>
  </div>
  <p style="margin-top:16px;font-size:12px;color:var(--fg-2)">Min height 44px · radius 8 · weight 600 · scale-down 0.98 on press, 80ms.</p>
</body></html>
