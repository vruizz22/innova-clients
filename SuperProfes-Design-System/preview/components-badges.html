<!doctype html>
<!-- @dsCard group="Components" name="Badges & pills" subtitle="Mastery · alert types · system states" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"/><title>Badges & pills</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 14px; }
  .pill { padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .lbl { width: 110px; font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  code { background: var(--slate-50); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style></head>
<body>
  <div class="row">
    <span class="lbl">Mastery</span>
    <span class="pill" style="background:#D2F2E0;color:#194E34"><span class="dot" style="background:#3DAA72"></span>Dominado</span>
    <span class="pill" style="background:#FFF4DB;color:#7A4F00"><span class="dot" style="background:#E8A33D"></span>En proceso</span>
    <span class="pill" style="background:#FCE3E3;color:#5A1F1F"><span class="dot" style="background:#D86060"></span>Necesita práctica</span>
  </div>
  <div class="row">
    <span class="lbl">Alerts</span>
    <span class="pill" style="background:#FCE3E3;color:#5A1F1F">AT_RISK_SKILL</span>
    <span class="pill" style="background:#FFF4DB;color:#7A4F00">COMMON_ERROR</span>
    <span class="pill" style="background:#FCE3E3;color:#5A1F1F">STUDENT_DROP</span>
    <span class="pill" style="background:#D2F2E0;color:#194E34">RESUELTO</span>
  </div>
  <div class="row">
    <span class="lbl">System</span>
    <span class="pill" style="background:var(--slate-100);color:var(--slate-700)">NUEVO</span>
    <span class="pill" style="background:var(--info-bg);color:var(--info-fg)">PROCESANDO</span>
    <span class="pill" style="background:var(--slate-100);color:var(--slate-700)">EXIF STRIPPED</span>
  </div>
</body></html>
