<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · sp-1 → sp-20" viewport="700x180" -->
<html lang="en"><head><meta charset="utf-8"/><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--sky-500); border-radius: 4px; width: 32px; }
  .v { font-size: 11px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .name { font-size: 11px; font-weight: 600; color: var(--fg-1); }
</style></head>
<body>
  <div class="scale">
    <div class="item"><div class="bar" style="height:4px"></div><div class="name">sp-1</div><div class="v">4px</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="name">sp-2</div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="name">sp-3</div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="name">sp-4</div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="height:20px"></div><div class="name">sp-5</div><div class="v">20</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="name">sp-6</div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="name">sp-8</div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="name">sp-10</div><div class="v">40</div></div>
    <div class="item"><div class="bar" style="height:56px"></div><div class="name">sp-14</div><div class="v">56</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="name">sp-20</div><div class="v">80</div></div>
  </div>
  <p style="margin-top:18px;font-size:12px;color:var(--fg-2);max-width:60ch">4px base. Touch targets ≥ 44px. Math keypad keys 56px on phone, 64px on tablet.</p>
</body></html>
