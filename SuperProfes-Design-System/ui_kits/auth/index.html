<!doctype html>
<!-- @dsCard group="UI Kit — Auth" name="Auth UI kit · Login / Register / Reset" subtitle="Login, Register, Verify, Forgot, Reset (OTP), Success — pairs with Nest /auth endpoints" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<title>SuperProfes · Auth</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { margin: 0; background: var(--bg-canvas); }
  .nav { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; padding: 12px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .nav button { padding: 8px 14px; border-radius: 9999px; border: 1px solid var(--border-strong); background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--fg-1); }
  .nav button.is-active { background: var(--slate-800); color: #fff; border-color: var(--slate-800); }
  .stage { min-height: calc(100vh - 56px); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
const { useState } = React;
const SCREENS = [
  { id: 'login',    label: 'Login',         render: () => <LoginScreen/> },
  { id: 'register', label: 'Register',      render: () => <RegisterScreen/> },
  { id: 'verify',   label: 'Verify email',  render: () => <VerifyEmailScreen/> },
  { id: 'forgot',   label: 'Forgot',        render: () => <ForgotScreen sent={false}/> },
  { id: 'forgot-sent', label: 'Forgot · sent', render: () => <ForgotScreen sent={true}/> },
  { id: 'reset',    label: 'Reset (OTP)',   render: () => <ResetScreen/> },
  { id: 'success',  label: 'Success',       render: () => <SuccessScreen/> },
];
function App() {
  const [id, setId] = useState('login');
  const cur = SCREENS.find(s => s.id === id);
  return (
    <>
      <nav className="nav" data-screen-label="Auth · nav">
        {SCREENS.map(s => (
          <button key={s.id} className={s.id === id ? 'is-active' : ''} onClick={() => setId(s.id)}>{s.label}</button>
        ))}
      </nav>
      <div className="stage" data-screen-label={`Auth · ${cur.label}`}>{cur.render()}</div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
