<!doctype html>
<!-- @dsCard group="UI Kit — Parent" name="Parent · Web" subtitle="Panel del apoderado en versión web" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperProfes · Parent Web</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<style>
  body { margin:0; background: var(--mint-50); font-family: var(--font-sans); }

  /* ── Nav ── */
  .pa-nav { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 28px; height:60px; }
  .pa-logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; color:var(--slate-900); }
  .pa-logo .mark { width:32px; height:32px; border-radius:9px; background:var(--mint-500); display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px; }
  .pa-tabs { display:flex; gap:4px; flex:1; justify-content:center; }
  .pa-tab { padding:8px 18px; border-radius:8px; border:0; background:transparent; font:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--fg-2); }
  .pa-tab.is-active { background:var(--mint-50); color:var(--mint-700); }
  .pa-actions { display:flex; align-items:center; gap:10px; }
  .pa-avatar { width:34px; height:34px; border-radius:9999px; background:var(--mint-400); color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; }

  /* ── Shell ── */
  .pa-shell { max-width:1100px; margin:0 auto; padding:28px 24px 60px; }
  .pa-hero { background:linear-gradient(135deg,var(--mint-600) 0%,var(--mint-800) 100%); border-radius:20px; padding:28px 32px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:24px; }
  .pa-hero h1 { margin:0 0 4px; font-size:26px; font-weight:700; letter-spacing:-.01em; }
  .pa-hero p { margin:0; font-size:14px; opacity:.8; }
  .pa-hero-stats { display:flex; gap:24px; flex-wrap:wrap; }
  .pa-hero-stat { text-align:center; }
  .pa-hero-stat .v { font-size:28px; font-weight:700; font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .pa-hero-stat .l { font-size:11px; opacity:.7; }

  /* ── Cards grid ── */
  .pa-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .pa-card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; }
  .pa-card h3 { margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-2); font-weight:700; }
  .span2 { grid-column:span 2; }

  /* Skill bars */
  .pa-skill { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
  .pa-skill:last-child { border-bottom:0; }
  .pa-skill .nm { flex:1; font-size:14px; font-weight:600; }
  .pa-skill .bar { flex:2; height:8px; background:var(--slate-100); border-radius:9999px; overflow:hidden; }
  .pa-skill .fill { height:100%; border-radius:9999px; transition:width .4s ease; }
  .pa-skill .pct { font-size:12px; font-family:ui-monospace,monospace; font-weight:700; width:36px; text-align:right; }

  /* Activity feed */
  .pa-event { display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--border); align-items:flex-start; }
  .pa-event:last-child { border-bottom:0; }
  .pa-event .dot { width:8px; height:8px; border-radius:9999px; margin-top:5px; flex-shrink:0; }
  .pa-event .msg { font-size:13px; line-height:1.5; flex:1; }
  .pa-event .ts { font-size:11px; color:var(--fg-3); font-family:ui-monospace,monospace; }

  /* Week streak */
  .pa-streak { display:flex; gap:6px; }
  .pa-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--fg-2); }
  .pa-day .pip { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; font-size:14px; }
  .pa-day .pip.on { background:var(--mint-100); color:var(--mint-700); font-weight:700; }
  .pa-day .pip.off { background:var(--slate-50); color:var(--fg-3); }

  /* Supervision */
  .pa-ctrl { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
  .pa-ctrl:last-child { border-bottom:0; }
  .pa-ctrl .lab { font-weight:600; font-size:14px; }
  .pa-ctrl .sub { font-size:12px; color:var(--fg-2); }
  .toggle { position:relative; width:44px; height:24px; background:var(--slate-200); border-radius:9999px; cursor:pointer; flex-shrink:0; transition:background .2s; border:0; }
  .toggle.on { background:var(--mint-500); }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:9999px; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .toggle.on::after { transform:translateX(20px); }

  /* GET /auth/me profile panel */
  .pa-me { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .pa-me-av { width:72px; height:72px; border-radius:9999px; background:var(--mint-100); color:var(--mint-700); display:grid; place-items:center; font-size:24px; font-weight:700; flex-shrink:0; }
  .pa-me-kv { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .pa-me-kv:last-child { border-bottom:0; }
  .pa-me-kv .k { color:var(--fg-2); font-weight:600; }

  @media(max-width:860px) { .pa-grid { grid-template-columns:1fr; } .span2 { grid-column:span 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SKILLS = [
  { name:'Resta con reserva',   pk:.32, trend:'↓' },
  { name:'Suma con llevadas',   pk:.71, trend:'↑' },
  { name:'Multiplicación',      pk:.58, trend:'↑' },
  { name:'División larga',      pk:.44, trend:'→' },
  { name:'Fracciones',          pk:.29, trend:'↓' },
];

const pkColor = p => p>=.7?{fill:'var(--mint-500)',text:'var(--mint-700)'}:p>=.4?{fill:'var(--mastery-medium)',text:'#7A4F00'}:{fill:'var(--mastery-weak)',text:'#7A2E2E'};

const EVENTS = [
  { dot:'var(--mint-500)', msg:'Antonia completó 15 ejercicios de suma con llevadas.', ts:'hoy 14:32' },
  { dot:'var(--mastery-medium)', msg:'Alerta del profesor: Antonia necesita refuerzo en resta con reserva.', ts:'hoy 12:01' },
  { dot:'var(--mint-500)', msg:'Antonia practicó 4 días seguidos esta semana.', ts:'ayer' },
  { dot:'var(--mastery-weak)', msg:'Fracciones bajó a 0.29 — práctica asignada automáticamente.', ts:'lun' },
];

const DAYS = ['L','M','M','J','V','S','D'];
const ACTIVE = [true,true,false,true,true,false,false];

function SkillBar({ s }) {
  const c = pkColor(s.pk);
  return (
    <div className="pa-skill">
      <span className="nm">{s.name}</span>
      <div className="bar"><span className="fill" style={{width:(s.pk*100)+'%',background:c.fill}}/></div>
      <span className="pct" style={{color:c.text}}>{(s.pk*100).toFixed(0)}%</span>
      <span style={{fontSize:12,color:s.trend==='↑'?'var(--mint-600)':s.trend==='↓'?'var(--mastery-weak)':'var(--fg-2)'}}>{s.trend}</span>
    </div>
  );
}

function SummaryTab() {
  return (
    <>
      <div className="pa-hero">
        <div>
          <h1>Hola, Carolina</h1>
          <p>Antonia · 4° A · Colegio San Pedro</p>
        </div>
        <div className="pa-hero-stats">
          <div className="pa-hero-stat"><div className="v">4</div><div className="l">días esta semana</div></div>
          <div className="pa-hero-stat"><div className="v">47%</div><div className="l">dominio promedio</div></div>
          <div className="pa-hero-stat"><div className="v">2</div><div className="l">alertas activas</div></div>
        </div>
      </div>
      <div className="pa-grid">
        <div className="pa-card span2">
          <h3>Dominio por habilidad · GET /mastery/:studentId</h3>
          {SKILLS.map((s,i) => <SkillBar key={i} s={s}/>)}
        </div>
        <div className="pa-card">
          <h3>Esta semana</h3>
          <div className="pa-streak">
            {DAYS.map((d,i)=>(
              <div key={i} className="pa-day">
                <div className={`pip ${ACTIVE[i]?'on':'off'}`}>{ACTIVE[i]?'✓':'–'}</div>
                <span>{d}</span>
              </div>
            ))}
          </div>
          <div style={{marginTop:14,background:'var(--mint-50)',borderRadius:10,padding:12}}>
            <div style={{fontSize:13,color:'var(--mint-800)',fontWeight:600}}>Próxima práctica</div>
            <div style={{fontSize:13,color:'var(--mint-700)',marginTop:4}}>Resta con reserva · 15 ejercicios · ~10 min</div>
          </div>
        </div>
        <div className="pa-card span2">
          <h3>Actividad reciente</h3>
          {EVENTS.map((e,i)=>(
            <div key={i} className="pa-event">
              <span className="dot" style={{background:e.dot}}/>
              <span className="msg">{e.msg}</span>
              <span className="ts">{e.ts}</span>
            </div>
          ))}
        </div>
        <div className="pa-card">
          <h3>Nota del profesor</h3>
          <div style={{background:'var(--sky-50)',border:'1px solid var(--sky-200)',borderRadius:10,padding:14,fontSize:14,color:'var(--sky-800)',lineHeight:1.55}}>
            Antonia está progresando bien en sumas. Esta semana trabajaremos más resta con reserva — si puedes practicar con ella en casa, ayuda mucho.
          </div>
          <div style={{marginTop:10,fontSize:12,color:'var(--fg-2)'}}>Sra. González · hace 2 días</div>
        </div>
      </div>
    </>
  );
}

function SupervisionTab() {
  const [notif, setNotif] = useState(true);
  const [photo, setPhoto] = useState(false);
  const [weekly, setWeekly] = useState(true);
  const [alerts, setAlerts] = useState(true);
  return (
    <div className="pa-card" style={{maxWidth:560}}>
      <h3>Configuración de supervisión</h3>
      {[
        {lab:'Notificaciones push',sub:'Avisos cuando el profesor activa una alerta',v:notif,set:setNotif},
        {lab:'Autorizo subida de fotos',sub:'Hojas escaneadas — anonimizadas y eliminadas a 30 días',v:photo,set:setPhoto},
        {lab:'Resumen semanal',sub:'Email los viernes con el progreso de la semana',v:weekly,set:setWeekly},
        {lab:'Alertas de riesgo',sub:'Aviso inmediato si el dominio cae bajo 0.4',v:alerts,set:setAlerts},
      ].map(ctrl => (
        <div key={ctrl.lab} className="pa-ctrl">
          <div><div className="lab">{ctrl.lab}</div><div className="sub">{ctrl.sub}</div></div>
          <button className={`toggle ${ctrl.v?'on':''}`} onClick={()=>ctrl.set(v=>!v)} aria-pressed={ctrl.v}/>
        </div>
      ))}
      <div style={{marginTop:14,padding:12,background:'var(--slate-50)',borderRadius:10,fontSize:12,color:'var(--fg-2)',lineHeight:1.6}}>
        Todos los datos se tratan bajo <strong>Ley 19.628</strong> y <strong>COPPA</strong>. Puedes revocar cualquier permiso aquí. Más info en nuestra política de privacidad.
      </div>
    </div>
  );
}

function MeTab() {
  const ME = { name:'Carolina Muñoz', email:'carolina.munoz@gmail.com', role:'parent', linkedKid:'Antonia Fuentes · 4° A', id:'usr_c9a1d3f2', since:'2025-08-14' };
  return (
    <div className="pa-card" style={{maxWidth:560}}>
      <h3>Mi perfil · GET /auth/me</h3>
      <div className="pa-me">
        <div className="pa-me-av">{ME.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:18}}>{ME.name}</div>
          <span style={{padding:'3px 10px',borderRadius:9999,background:'var(--mint-100)',color:'var(--mint-700)',fontSize:11,fontWeight:700}}>APODERADO</span>
        </div>
      </div>
      <div style={{marginTop:16,background:'#fff',borderRadius:12,border:'1px solid var(--border)',padding:'0 16px'}}>
        {[
          {k:'Correo',v:ME.email},
          {k:'Vinculado con',v:ME.linkedKid},
          {k:'ID de usuario',v:ME.id},
          {k:'Miembro desde',v:ME.since},
        ].map(kv=>(
          <div key={kv.k} className="pa-me-kv"><span className="k">{kv.k}</span><span style={{fontFamily:'ui-monospace,monospace',fontSize:13}}>{kv.v}</span></div>
        ))}
      </div>
      <div style={{marginTop:14,display:'flex',gap:10}}>
        <button className="btn btn-ghost" style={{flex:1}}><Icon name="settings" size={14}/> Ajustes</button>
        <button className="btn" style={{flex:1,background:'var(--mastery-weak)',color:'#fff',borderColor:'transparent'}}>Cerrar sesión</button>
      </div>
    </div>
  );
}

const TABS = [
  {id:'summary',  label:'Resumen'},
  {id:'supervise',label:'Supervisión'},
  {id:'me',       label:'Mi perfil'},
];

function App() {
  const [tab, setTab] = useState('summary');
  return (
    <div data-screen-label={`Parent web · ${tab}`}>
      <nav className="pa-nav">
        <div className="pa-logo"><div className="mark">SP</div>Super<span style={{color:'var(--mint-500)'}}>Profes</span></div>
        <div className="pa-tabs">
          {TABS.map(t=><button key={t.id} className={`pa-tab ${tab===t.id?'is-active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>)}
        </div>
        <div className="pa-actions">
          <button className="btn btn-ghost" style={{minHeight:36,padding:'6px 12px'}}><Icon name="bell" size={18}/></button>
          <div className="pa-avatar">CM</div>
        </div>
      </nav>
      <div className="pa-shell">
        {tab==='summary'   && <SummaryTab/>}
        {tab==='supervise' && <SupervisionTab/>}
        {tab==='me'        && <MeTab/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
