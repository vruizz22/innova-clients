<!doctype html>
<!-- @dsCard group="UI Kit — Parent" name="Parent App" subtitle="SuperProfes apoderado · resumen de dominio y supervisión (clickable)" viewport="600x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<title>SuperProfes · Parent App</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-100); padding: 24px; min-height: 100vh; display: grid; place-items: start center; }
  .stage { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .col-stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .nav button { padding: 8px 14px; border-radius: 9999px; border: 1px solid var(--border-strong); background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .nav button.is-active { background: var(--slate-800); color: #fff; border-color: var(--slate-800); }
  .label { color: var(--fg-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel" src="../shared/ios-frame.jsx"></script>
<script type="text/babel" src="ParentComponents.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [tab, setTab] = useState('summary');
  const node = (() => {
    if (tab === 'summary') return <div className="pa-app"><ParentHeader/><ParentSummary/></div>;
    if (tab === 'supervise') return <div className="pa-app"><ParentHeader/><SupervisionFlow/></div>;
    if (tab === 'push') return <PushStack/>;
  })();
  return (
    <div>
      <div className="nav">
        <button className={tab==='summary'?'is-active':''} onClick={()=>setTab('summary')}>Summary</button>
        <button className={tab==='supervise'?'is-active':''} onClick={()=>setTab('supervise')}>Supervisión</button>
        <button className={tab==='push'?'is-active':''} onClick={()=>setTab('push')}>Push (lockscreen)</button>
      </div>
      <div className="stage">
        <div className="col-stack">
          <IOSDevice width={390} height={780}>{node}</IOSDevice>
          <div className="label">{tab}</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
