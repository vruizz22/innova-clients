<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<title>SuperProfes · Parent Onboarding</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-100); padding: 24px; min-height: 100vh; display: grid; place-items: start center; margin: 0; }
  .stage { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .col-stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .nav button { padding: 8px 14px; border-radius: 9999px; border: 1px solid var(--border-strong); background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .nav button.is-active { background: var(--slate-800); color: #fff; border-color: var(--slate-800); }
  .label { color: var(--fg-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }

  .ob-app { padding: 56px 22px 24px; min-height: 100%; display: flex; flex-direction: column; gap: 18px; background: #fff; }
  .ob-prog { display: flex; gap: 6px; }
  .ob-prog .b { flex: 1; height: 4px; border-radius: 9999px; background: var(--slate-100); }
  .ob-prog .b.is-on { background: var(--mint-500); }
  .ob-h { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.25; }
  .ob-sub { color: var(--fg-2); font-size: 14px; line-height: 1.5; }
  .ob-illust { background: var(--mint-50); border-radius: 16px; height: 180px; display: grid; place-items: center; color: var(--mint-700); }

  .ob-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border-strong); font-family: inherit; font-size: 16px; background: #fff; }
  .ob-input:focus { outline: 2px solid var(--mint-300); outline-offset: 0; border-color: var(--mint-500); }
  .ob-codebox { display: flex; gap: 8px; justify-content: center; }
  .ob-codebox input { width: 44px; height: 56px; text-align: center; font-family: ui-monospace, monospace; font-size: 22px; font-weight: 700; border-radius: 12px; border: 1.5px solid var(--border-strong); background: #fff; }
  .ob-consent { background: var(--slate-50); border-radius: 12px; padding: 16px; font-size: 13px; color: var(--fg-1); line-height: 1.55; }
  .ob-check { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 10px; cursor: pointer; }
  .ob-check.is-on { background: var(--mint-50); }
  .ob-check input { margin-top: 2px; accent-color: var(--mint-600); }
  .ob-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .ob-cta { width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--mint-500); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .ob-cta:disabled { background: var(--slate-200); color: var(--fg-2); cursor: not-allowed; }
  .ob-link { background: none; border: 0; color: var(--mint-700); font-weight: 600; font-size: 13px; cursor: pointer; }

  .ob-kid { display: flex; gap: 12px; align-items: center; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; }
  .ob-kid.is-sel { border-color: var(--mint-500); background: var(--mint-50); }
  .ob-kid .av { width: 44px; height: 44px; border-radius: 9999px; background: var(--mint-100); color: var(--mint-700); display: grid; place-items: center; font-weight: 700; }
  .ob-kid .nm { font-weight: 700; font-size: 15px; }
  .ob-kid .meta { font-size: 12px; color: var(--fg-2); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel" src="../shared/ios-frame.jsx"></script>

<script type="text/babel">
const { useState } = React;
const TOTAL = 5;

function Welcome({ next }) {
  return (
    <div className="ob-app">
      <div style={{height:8}}/>
      <div className="ob-illust">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 9.5L12 4l9 5.5M5 10v9.5h14V10M9 19.5v-5h6v5"/></svg>
      </div>
      <h1 className="ob-h">Acompaña el aprendizaje de tu hijo o hija</h1>
      <p className="ob-sub">Verás su dominio en cada habilidad —no notas— y recibirás avisos del profesor cuando haya algo que reforzar en casa.</p>
      <div className="ob-foot">
        <button className="ob-cta" onClick={next}>Comenzar</button>
        <button className="ob-link">Ya tengo cuenta · iniciar sesión</button>
      </div>
    </div>
  );
}

function LinkCode({ next }) {
  const [code, setCode] = useState(['', '', '', '', '', '']);
  const set = (i, v) => setCode(c => { const n = [...c]; n[i] = v.slice(-1).toUpperCase(); return n; });
  const ok = code.every(c => c.length === 1);
  return (
    <div className="ob-app">
      <div className="ob-prog"><span className="b is-on"/><span className="b is-on"/><span className="b"/><span className="b"/><span className="b"/></div>
      <h1 className="ob-h">Código de vinculación</h1>
      <p className="ob-sub">Pídelo al profesor de tu hijo o hija. Es un código de 6 caracteres válido por 24 horas.</p>
      <div className="ob-codebox">
        {code.map((c, i) => <input key={i} value={c} onChange={e => set(i, e.target.value)} maxLength="1"/>)}
      </div>
      <div className="ob-consent">
        <strong>¿Por qué un código?</strong><br/>
        Solo el profesor puede vincularte con un alumno: garantiza que solo tú —no terceros— veas los datos de tu hijo/hija. Cumple <strong>Ley 19.628</strong> y <strong>Ley 21.180</strong>.
      </div>
      <div className="ob-foot">
        <button className="ob-cta" disabled={!ok} onClick={next}>Continuar</button>
        <button className="ob-link">No tengo el código todavía</button>
      </div>
    </div>
  );
}

function ConfirmKid({ next }) {
  const [sel, setSel] = useState('s1');
  const kids = [
    { id: 's1', name: 'Antonia Fuentes', meta: '4° A · Colegio San Pedro · Sra. González' },
  ];
  return (
    <div className="ob-app">
      <div className="ob-prog"><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/><span className="b"/><span className="b"/></div>
      <h1 className="ob-h">¿Es esta tu hija?</h1>
      <p className="ob-sub">El código que ingresaste corresponde a este alumno.</p>
      <div className="col gap-3">
        {kids.map(k => (
          <div key={k.id} className={`ob-kid ${sel===k.id?'is-sel':''}`} onClick={()=>setSel(k.id)}>
            <div className="av">{k.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</div>
            <div style={{flex:1}}>
              <div className="nm">{k.name}</div>
              <div className="meta">{k.meta}</div>
            </div>
            {sel===k.id && <Icon name="check" size={20}/>}
          </div>
        ))}
      </div>
      <div className="ob-consent">Vínculo se registra en <code style={{fontFamily:'ui-monospace,monospace'}}>ParentLink</code>. Puedes desvincularte cuando quieras desde Ajustes.</div>
      <div className="ob-foot">
        <button className="ob-cta" onClick={next}>Sí, es mi hija</button>
        <button className="ob-link">No es mi hija · cambiar código</button>
      </div>
    </div>
  );
}

function Consent({ next }) {
  const [a1, setA1] = useState(false);
  const [a2, setA2] = useState(false);
  const [a3, setA3] = useState(true);
  return (
    <div className="ob-app">
      <div className="ob-prog"><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/><span className="b"/></div>
      <h1 className="ob-h">Consentimiento parental</h1>
      <p className="ob-sub">Tu hija es menor de edad. Para activar la cuenta necesitamos tu autorización explícita en estos puntos:</p>

      <label className={`ob-check ${a1?'is-on':''}`}>
        <input type="checkbox" checked={a1} onChange={e=>setA1(e.target.checked)}/>
        <span><strong>Procesamiento académico.</strong> Autorizo a SuperProfes a recibir y analizar los intentos de mi hija para identificar errores y recomendarle práctica adaptativa. <span style={{color:'var(--fg-2)'}}>(Obligatorio · COPPA)</span></span>
      </label>

      <label className={`ob-check ${a2?'is-on':''}`}>
        <input type="checkbox" checked={a2} onChange={e=>setA2(e.target.checked)}/>
        <span><strong>Subida de fotos de cuaderno.</strong> Autorizo el envío de fotografías de hojas de trabajo. Las imágenes se anonimizan y eliminan a 30 días. <span style={{color:'var(--fg-2)'}}>(Opcional)</span></span>
      </label>

      <label className={`ob-check ${a3?'is-on':''}`}>
        <input type="checkbox" checked={a3} onChange={e=>setA3(e.target.checked)}/>
        <span><strong>Notificaciones push.</strong> Recibir avisos cuando el profesor active una alerta para mi hija. <span style={{color:'var(--fg-2)'}}>(Recomendado)</span></span>
      </label>

      <div className="ob-consent">
        <strong>Lo que NO hacemos:</strong> nunca compartimos PII con servicios analíticos de terceros · LLMs y OCR reciben solo UUIDs anónimos · datos no se usan para publicidad. <button className="ob-link" style={{padding:0}}>Política completa →</button>
      </div>
      <div className="ob-foot">
        <button className="ob-cta" disabled={!a1} onClick={next}>Autorizar y continuar</button>
        <button className="ob-link">Rechazar y salir</button>
      </div>
    </div>
  );
}

function Done({ next }) {
  return (
    <div className="ob-app">
      <div className="ob-prog"><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/><span className="b is-on"/></div>
      <div style={{display:'grid', placeItems:'center', flex:1, gap:16}}>
        <div style={{width:80, height:80, borderRadius:9999, background:'var(--mint-100)', display:'grid', placeItems:'center', color:'var(--mint-700)'}}>
          <Icon name="check" size={40}/>
        </div>
        <h1 className="ob-h" style={{textAlign:'center'}}>¡Listo, Carolina!</h1>
        <p className="ob-sub" style={{textAlign:'center'}}>Estás vinculada con <strong>Antonia</strong>. Verás su progreso a partir de su próxima sesión de práctica.</p>
      </div>
      <div className="ob-foot">
        <button className="ob-cta" onClick={next}>Ir al resumen</button>
      </div>
    </div>
  );
}

const SCREENS = [
  { id: 'welcome', label: 'Welcome',  R: Welcome },
  { id: 'code',    label: 'Código',   R: LinkCode },
  { id: 'kid',     label: 'Confirmar',R: ConfirmKid },
  { id: 'consent', label: 'Consent',  R: Consent },
  { id: 'done',    label: 'Done',     R: Done },
];

function App() {
  const [tab, setTab] = useState('welcome');
  const cur = SCREENS.find(s => s.id === tab);
  const idx = SCREENS.findIndex(s => s.id === tab);
  const advance = () => setTab(SCREENS[Math.min(idx+1, SCREENS.length-1)].id);
  return (
    <div>
      <div className="nav">
        {SCREENS.map(s => (
          <button key={s.id} className={s.id===tab?'is-active':''} onClick={()=>setTab(s.id)}>{s.label}</button>
        ))}
      </div>
      <div className="stage">
        <div className="col-stack" data-screen-label={`Parent · onboarding · ${cur.label}`}>
          <IOSDevice width={390} height={780}><cur.R next={advance}/></IOSDevice>
          <div className="label">{cur.label}</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
