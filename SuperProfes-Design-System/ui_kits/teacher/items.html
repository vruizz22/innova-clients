<!doctype html>
<!-- @dsCard group="UI Kit — Teacher" name="Teacher · Item Bank" subtitle="Banco de ítems diagnósticos por habilidad" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>SuperProfes · Item Bank</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-50); margin: 0; }
  .ib-shell { max-width: 1240px; margin: 0 auto; padding: 28px 24px; }
  .ib-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
  .ib-head h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
  .ib-grid { display: grid; grid-template-columns: 280px 1fr 360px; gap: 18px; align-items: start; }
  .ib-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; }
  .ib-side { padding: 16px; }
  .ib-side h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; color: var(--fg-2); letter-spacing: .05em; }
  .ib-skill { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--fg-1); }
  .ib-skill:hover { background: var(--slate-50); }
  .ib-skill.is-sel { background: var(--sky-50); color: var(--sky-800); font-weight: 600; }
  .ib-skill .ct { font-size: 11px; color: var(--fg-2); font-family: ui-monospace, monospace; }
  .ib-table { width: 100%; border-collapse: collapse; }
  .ib-table th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--fg-2); letter-spacing: .05em; padding: 10px 16px; border-bottom: 1px solid var(--border); font-weight: 700; }
  .ib-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .ib-table tr { cursor: pointer; }
  .ib-table tr.is-sel { background: var(--sky-50); }
  .ib-table tr:hover { background: var(--slate-50); }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--fg-2); }
  .pill { padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
  .pill.easy { background: var(--mint-100); color: var(--mint-700); }
  .pill.med { background: #FFEFCD; color: var(--error-fg); }
  .pill.hard { background: #FAD9D9; color: #7A2E2E; }

  .ib-detail { padding: 18px; }
  .ib-detail h2 { margin: 0 0 4px; font-size: 18px; }
  .ib-prob { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums slashed-zero; font-size: 32px; text-align: right; padding: 16px 20px; background: var(--slate-50); border-radius: 10px; line-height: 1.2; }
  .icc { width: 100%; height: 160px; background: var(--slate-50); border-radius: 10px; position: relative; overflow: hidden; }
  .icc svg { width: 100%; height: 100%; display: block; }
  .ib-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .ib-stat { background: var(--slate-50); border-radius: 8px; padding: 10px; }
  .ib-stat .lab { font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .ib-stat .v { font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700; color: var(--fg-1); margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>

<script type="text/babel">
const { useState, useMemo } = React;

const SKILLS = [
  { key: 'subtraction_borrow',  name: 'Resta con reserva',     count: 24 },
  { key: 'addition_carry',      name: 'Suma con llevadas',     count: 18 },
  { key: 'multiplication_table',name: 'Tablas multiplicar',    count: 30 },
  { key: 'long_division',       name: 'División larga',        count: 12 },
];

const ITEMS = {
  subtraction_borrow: [
    { id: 'it_001', expr: '53 − 26', a: 1.4, b: -0.2, n: 312, pCorr: 0.62 },
    { id: 'it_002', expr: '82 − 47', a: 1.6, b:  0.1, n: 287, pCorr: 0.58 },
    { id: 'it_003', expr: '40 − 18', a: 1.2, b: -0.5, n: 154, pCorr: 0.71 },
    { id: 'it_004', expr: '305 − 178', a: 1.8, b:  0.6, n: 91,  pCorr: 0.42 },
    { id: 'it_005', expr: '700 − 234', a: 1.7, b:  0.9, n: 88,  pCorr: 0.34 },
    { id: 'it_006', expr: '60 − 27', a: 1.3, b: -0.3, n: 203, pCorr: 0.66 },
    { id: 'it_007', expr: '903 − 487', a: 2.0, b:  1.1, n: 64,  pCorr: 0.28 },
    { id: 'it_008', expr: '95 − 28', a: 1.5, b:  0.0, n: 168, pCorr: 0.55 },
  ],
  addition_carry: [
    { id: 'it_101', expr: '47 + 38', a: 1.3, b: -0.4, n: 124, pCorr: 0.74 },
    { id: 'it_102', expr: '256 + 187', a: 1.5, b: 0.4, n: 89, pCorr: 0.51 },
  ],
  multiplication_table: [],
  long_division: [],
};

function diffPill(b) {
  if (b < -0.3) return ['easy', 'Fácil'];
  if (b < 0.5)  return ['med', 'Media'];
  return ['hard', 'Difícil'];
}

function ICC({ a, b }) {
  const W = 320, H = 160, M = { l: 28, r: 8, t: 8, b: 22 };
  const xs = [];
  for (let θ = -3; θ <= 3; θ += 0.1) xs.push(θ);
  const points = xs.map(θ => {
    const p = 1 / (1 + Math.exp(-a * (θ - b)));
    const x = M.l + ((θ + 3) / 6) * (W - M.l - M.r);
    const y = M.t + (1 - p) * (H - M.t - M.b);
    return [x, y];
  });
  const path = 'M ' + points.map(p => p.join(',')).join(' L ');
  // mark θ=b (P=0.5)
  const xb = M.l + ((b + 3) / 6) * (W - M.l - M.r);
  const y50 = M.t + 0.5 * (H - M.t - M.b);
  return (
    <svg viewBox={`0 0 ${W} ${H}`}>
      {/* y grid */}
      {[0, 0.25, 0.5, 0.75, 1].map(p => {
        const y = M.t + (1 - p) * (H - M.t - M.b);
        return <line key={p} x1={M.l} y1={y} x2={W-M.r} y2={y} stroke="#E5E9F0" strokeDasharray={p === 0.5 ? '0' : '2 4'}/>;
      })}
      {[0, 0.5, 1].map(p => {
        const y = M.t + (1 - p) * (H - M.t - M.b);
        return <text key={p} x={M.l - 4} y={y+3} textAnchor="end" fontSize="9" fill="var(--fg-2)" fontFamily="ui-monospace">{p}</text>;
      })}
      {/* x axis labels */}
      {[-3, 0, 3].map(θ => {
        const x = M.l + ((θ + 3) / 6) * (W - M.l - M.r);
        return <text key={θ} x={x} y={H-6} textAnchor="middle" fontSize="9" fill="var(--fg-2)" fontFamily="ui-monospace">θ={θ}</text>;
      })}
      {/* curve */}
      <path d={path} fill="none" stroke="var(--sky-500)" strokeWidth="2"/>
      {/* b marker */}
      <line x1={xb} y1={M.t} x2={xb} y2={H-M.b} stroke="var(--mastery-medium)" strokeWidth="1.5" strokeDasharray="3 3"/>
      <circle cx={xb} cy={y50} r="3.5" fill="var(--mastery-medium)"/>
      <text x={xb+6} y={y50-4} fontSize="10" fill="var(--mastery-medium)" fontWeight="600">b={b.toFixed(1)}</text>
    </svg>
  );
}

function App() {
  const [skKey, setSkKey] = useState('subtraction_borrow');
  const items = ITEMS[skKey] || [];
  const [selId, setSelId] = useState(items[0]?.id ?? null);
  const sel = items.find(i => i.id === selId) ?? items[0];

  return (
    <div className="ib-shell" data-screen-label="Teacher · Item Bank">
      <div className="ib-head">
        <div>
          <h1>Banco de items</h1>
          <div className="t-caption">GET <code style={{fontFamily:'ui-monospace,monospace'}}>/items</code> · parámetros IRT 2PL recalibrados nightly</div>
        </div>
        <div className="row gap-2">
          <button className="btn btn-ghost"><Icon name="filter" size={14}/> Filtrar</button>
          <button className="btn btn-primary"><Icon name="plus" size={14}/> Nuevo item</button>
        </div>
      </div>

      <div className="ib-grid">
        <aside className="ib-card ib-side">
          <h3>Habilidades</h3>
          <div className="col gap-2">
            {SKILLS.map(s => (
              <div key={s.key} className={`ib-skill ${s.key === skKey ? 'is-sel' : ''}`} onClick={() => { setSkKey(s.key); setSelId(ITEMS[s.key]?.[0]?.id ?? null); }}>
                <span>{s.name}</span><span className="ct">{s.count}</span>
              </div>
            ))}
          </div>
        </aside>

        <div className="ib-card" style={{overflow:'hidden'}}>
          <table className="ib-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Expresión</th>
                <th>a</th>
                <th>b</th>
                <th>Dificultad</th>
                <th>n</th>
                <th>P̂(correct)</th>
              </tr>
            </thead>
            <tbody>
              {items.map(it => {
                const [cls, lab] = diffPill(it.b);
                return (
                  <tr key={it.id} className={selId === it.id ? 'is-sel' : ''} onClick={() => setSelId(it.id)}>
                    <td className="mono">{it.id}</td>
                    <td className="math" style={{fontWeight:600}}>{it.expr}</td>
                    <td className="mono">{it.a.toFixed(2)}</td>
                    <td className="mono">{it.b.toFixed(2)}</td>
                    <td><span className={`pill ${cls}`}>{lab}</span></td>
                    <td className="mono">{it.n}</td>
                    <td className="mono">{(it.pCorr*100).toFixed(0)}%</td>
                  </tr>
                );
              })}
              {items.length === 0 && (
                <tr><td colSpan={7} style={{textAlign:'center', color:'var(--fg-2)', padding:32}}>Sin items publicados — pendiente de seed.</td></tr>
              )}
            </tbody>
          </table>
        </div>

        {sel && (
          <aside className="ib-card ib-detail">
            <div className="t-caption mono">{sel.id}</div>
            <h2 style={{marginTop:4, marginBottom:12}}>Item</h2>
            <div className="ib-prob math">{sel.expr}</div>
            <div className="ib-stats">
              <div className="ib-stat"><div className="lab">discriminación a</div><div className="v">{sel.a.toFixed(2)}</div></div>
              <div className="ib-stat"><div className="lab">dificultad b</div><div className="v">{sel.b.toFixed(2)}</div></div>
              <div className="ib-stat"><div className="lab">intentos</div><div className="v">{sel.n}</div></div>
              <div className="ib-stat"><div className="lab">% correctos</div><div className="v">{(sel.pCorr*100).toFixed(0)}%</div></div>
            </div>
            <div style={{marginTop:14}}>
              <div className="t-caption" style={{marginBottom:6, fontWeight:700, color:'var(--fg-1)'}}>Curva característica (ICC)</div>
              <div className="icc"><ICC a={sel.a} b={sel.b}/></div>
              <div className="t-caption" style={{marginTop:6}}>P(correct | θ) = 1 / (1 + e<sup>−a(θ−b)</sup>)</div>
            </div>
            <div className="row gap-2" style={{marginTop:14}}>
              <button className="btn btn-ghost" style={{flex:1}}><Icon name="refresh" size={14}/> Recalibrar</button>
              <button className="btn btn-primary" style={{flex:1}}><Icon name="send" size={14}/> Asignar</button>
            </div>
          </aside>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
