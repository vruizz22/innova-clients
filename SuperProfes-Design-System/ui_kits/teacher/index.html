<!doctype html>
<!-- @dsCard group="UI Kit — Teacher" name="Teacher Dashboard" subtitle="SuperProfes Docente · mastery heatmap + alerts (clickable)" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>SuperProfes · Teacher Dashboard</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="MasteryHeatmap.jsx"></script>
<script type="text/babel" src="Alerts.jsx"></script>
<script type="text/babel" src="StudentDrillDown.jsx"></script>
<script type="text/babel" src="StatRow.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('dashboard');
  const [alerts, setAlerts] = useState(window.ALERTS_SEED);
  const [drill, setDrill] = useState(null);

  const onCell = (st, sk, v) => setDrill({ st, sk, v });
  const resolve = (a) => setAlerts(alerts.filter(x => x.id !== a.id));

  return (
    <div className="t-app">
      <TeacherSidebar active={active} onNav={setActive}/>
      <TeacherTopBar/>
      <main className="t-main">
        <div className="t-page-head">
          <div>
            <h1>Buenas tardes, Sra. González</h1>
            <p>Vista general del curso 4° A · Sem. 28 · 32 alumnos</p>
          </div>
          <button className="btn btn-primary"><Icon name="plus" size={16}/> Asignar práctica</button>
        </div>

        <StatRow alertsCount={alerts.length}/>

        <div className="t-grid-2">
          <div>
            <div className="t-section-head">
              <h2>Mastery del aula</h2>
              <span className="t-caption">Toca cualquier celda para ver el detalle del alumno</span>
            </div>
            <MasteryHeatmap onCell={onCell}/>
          </div>
          <div>
            <div className="t-section-head">
              <h2>Alertas pendientes</h2>
              <span className="t-allcaps muted">{alerts.length} sin resolver</span>
            </div>
            <AlertsPanel alerts={alerts} onResolve={resolve}/>
          </div>
        </div>

        {drill && (
          <div style={{position:'fixed', inset:0, background:'rgba(15,42,61,.40)', display:'grid', placeItems:'center', zIndex:50, padding:24}} onClick={() => setDrill(null)}>
            <div style={{width:560, maxWidth:'100%'}} onClick={e => e.stopPropagation()}>
              <StudentDrillDown student={drill.st} skill={drill.sk} p={drill.v} onClose={() => setDrill(null)} onAssign={() => setDrill(null)}/>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
