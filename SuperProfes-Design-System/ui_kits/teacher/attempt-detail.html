<!doctype html>
<!-- @dsCard group="UI Kit — Teacher" name="Teacher · Detalle de intento" subtitle="Revisión detallada de un intento del estudiante" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>SuperProfes · Attempt Detail</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-50); margin: 0; padding: 28px 24px; }
  .ad-shell { max-width: 1180px; margin: 0 auto; }
  .ad-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
  .ad-head h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .ad-grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }

  .ad-list { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .ad-list-row { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .ad-list-row:last-child { border-bottom: 0; }
  .ad-list-row:hover { background: var(--slate-50); }
  .ad-list-row.is-sel { background: var(--sky-50); border-left: 3px solid var(--sky-500); padding-left: 11px; }
  .ad-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
  .ad-dot.ok { background: var(--mint-500); }
  .ad-dot.err { background: var(--mastery-medium); }
  .ad-dot.unk { background: var(--slate-300); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .ad-list-row .nm { font-weight: 600; font-size: 13px; color: var(--fg-1); }
  .ad-list-row .ts { font-size: 11px; color: var(--fg-2); font-family: ui-monospace, monospace; }
  .ad-list-row .et { font-size: 11px; color: var(--fg-2); margin-left: auto; }

  .ad-detail { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .ad-meta { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .ad-meta h2 { margin: 0 0 4px; font-size: 18px; }
  .src-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .src-rule { background: var(--mint-100); color: var(--mint-700); }
  .src-llm  { background: #EAE0FA; color: #5A2A93; }
  .src-ocr  { background: var(--sky-100); color: var(--sky-700); }
  .src-human { background: var(--slate-100); color: var(--slate-700); }

  .ad-section { padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .ad-section:last-child { border-bottom: 0; }
  .ad-section h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-2); font-weight: 700; }

  .ad-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .ad-prob { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums slashed-zero; font-size: 28px; line-height: 1.4; padding: 14px 18px; background: var(--slate-50); border-radius: 10px; text-align: right; white-space: pre; }
  .ad-step { display: flex; gap: 14px; padding: 8px 12px; border-radius: 8px; align-items: center; font-family: ui-monospace, monospace; font-size: 14px; font-variant-numeric: tabular-nums slashed-zero; }
  .ad-step .n { color: var(--fg-2); width: 18px; }
  .ad-step .ex { flex: 1; }
  .ad-step .ts { color: var(--fg-3); font-size: 11px; }
  .ad-step.bad { background: var(--error-bg); color: var(--error-fg); }

  .ad-evidence { background: var(--slate-50); border-radius: 10px; padding: 14px; }
  .ad-evidence li { margin-bottom: 6px; font-size: 14px; line-height: 1.5; }
  .ad-quote { background: #F5EDFB; border-left: 3px solid #8E5BC9; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.5; color: #3A1B5E; margin-top: 8px; }
  .ad-quote .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: #8E5BC9; margin-bottom: 4px; }

  .ad-bkt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ad-bkt-cell { background: var(--slate-50); border-radius: 8px; padding: 10px; }
  .ad-bkt-cell .lab { font-size: 10px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .ad-bkt-cell .v { font-family: ui-monospace, monospace; font-size: 16px; font-weight: 700; color: var(--fg-1); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ad-bkt-cell .delta { font-size: 11px; color: var(--mint-700); font-weight: 700; }

  .ad-actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>

<script type="text/babel">
const { useState } = React;

const ATTEMPTS = [
  {
    id: 'a_2f8b1', studentName: 'Antonia F.', expr: '53 − 26', studentAns: 33, expected: 27,
    isCorrect: false, errorType: 'BORROW_OMITTED', source: 'RULE_ENGINE', confidence: 0.93,
    ts: '14:32', latencyMs: 4,
    rawSteps: [
      { t: 0,    expr: '53\n−26\n———', ok: true },
      { t: 980,  expr: '  3 − 6 = 3', ok: false, note: 'Sin reserva — debió tomar prestado de las decenas' },
      { t: 1820, expr: '  5 − 2 = 3', ok: true },
      { t: 2410, expr: '   = 33', ok: false }
    ],
    evidence: ['Units column: 3−6 done without borrow → answer 33 vs expected 27', 'Tens column 5−2 done correctly assuming no borrow occurred'],
    bkt: { skill: 'subtraction_borrow', before: 0.41, after: 0.34, pS: 0.10, pG: 0.20 }
  },
  {
    id: 'a_2f8b0', studentName: 'Antonia F.', expr: '82 − 47', studentAns: 35, expected: 35,
    isCorrect: true, errorType: null, source: 'RULE_ENGINE', confidence: 1.0,
    ts: '14:31', latencyMs: 3,
    rawSteps: [
      { t: 0,    expr: '82\n−47\n———', ok: true },
      { t: 1410, expr: '12 − 7 = 5 (reserva)', ok: true },
      { t: 2330, expr: '7 − 4 = 3', ok: true },
      { t: 3010, expr: '  = 35', ok: true }
    ],
    evidence: [],
    bkt: { skill: 'subtraction_borrow', before: 0.36, after: 0.41, pS: 0.10, pG: 0.20 }
  },
  {
    id: 'a_2f8af', studentName: 'Benjamín S.', expr: '305 − 178', studentAns: 273, expected: 127,
    isCorrect: false, errorType: 'BORROW_FROM_ZERO_ERROR', source: 'LLM', confidence: 0.81,
    ts: '14:28', latencyMs: 2840,
    rawSteps: [
      { t: 0,    expr: '305\n−178\n————', ok: true },
      { t: 1240, expr: '5 − 8: tomó prestado de 0', ok: false },
      { t: 2110, expr: '0 → 10, sin propagar', ok: false },
      { t: 3380, expr: '   = 273', ok: false }
    ],
    evidence: [
      'Student attempted to borrow from the tens column (which has 0).',
      'Did not propagate the borrow chain through to the hundreds column.',
      'Final answer reflects partial-borrow logic typical of Brown & VanLehn (1980) "stop borrow at zero" pattern.'
    ],
    llmCitation: { model: 'claude-haiku-4-5', cached: 1840, fresh: 320, costUsd: 0.0021, batchSize: 20 },
    bkt: { skill: 'subtraction_borrow', before: 0.52, after: 0.43, pS: 0.10, pG: 0.20 }
  },
  {
    id: 'a_2f8ae', studentName: 'Catalina P.', expr: '700 − 234', studentAns: 466, expected: 466,
    isCorrect: true, errorType: null, source: 'OCR', confidence: 0.91,
    ts: '14:25', latencyMs: 1240,
    rawSteps: [
      { t: 0, expr: '[OCR] 700 − 234', ok: true },
      { t: 1, expr: '[OCR] = 466', ok: true }
    ],
    evidence: ['Gemini 2.0 Flash extracted handwritten worksheet with overall_confidence=0.91'],
    bkt: { skill: 'subtraction_borrow', before: 0.66, after: 0.71, pS: 0.10, pG: 0.20 }
  },
  {
    id: 'a_2f8ad', studentName: 'Diego V.', expr: '60 − 27', studentAns: 47, expected: 33,
    isCorrect: false, errorType: 'UNCLASSIFIED', source: null, confidence: null,
    ts: '14:21', latencyMs: 4,
    rawSteps: [
      { t: 0, expr: '60\n−27', ok: true },
      { t: 1, expr: '  = 47', ok: false }
    ],
    evidence: ['Pendiente — encolado en SQS llm-classify-queue (batch 20, ~3 min ETA)'],
    bkt: { skill: 'subtraction_borrow', before: 0.28, after: 0.28, pS: 0.10, pG: 0.20 }
  },
];

function srcPill(s) {
  if (s === 'RULE_ENGINE') return ['src-rule', 'rule engine · <5ms'];
  if (s === 'LLM')         return ['src-llm', 'LLM · Haiku 4.5'];
  if (s === 'OCR')         return ['src-ocr', 'OCR · Gemini'];
  if (s === 'HUMAN')       return ['src-human', 'human override'];
  return ['src-human', 'pendiente'];
}

function dotClass(a) {
  if (a.errorType === 'UNCLASSIFIED') return 'unk';
  if (a.isCorrect) return 'ok';
  return 'err';
}

function Detail({ a }) {
  const [src, srcLabel] = srcPill(a.source);
  return (
    <div className="ad-detail">
      <div className="ad-meta">
        <div>
          <div className="t-caption" style={{fontFamily:'ui-monospace,monospace', fontSize:11}}>attempt · {a.id}</div>
          <h2>{a.studentName} · <span className="math">{a.expr}</span></h2>
          <div className="t-caption">{a.ts} · 4° A · skill <code style={{fontFamily:'ui-monospace,monospace'}}>subtraction_borrow</code></div>
        </div>
        <div className="row gap-2" style={{flexWrap:'wrap', justifyContent:'flex-end'}}>
          {a.isCorrect
            ? <span className="src-pill" style={{background:'var(--mint-100)', color:'var(--mint-700)'}}>✓ Correcto</span>
            : a.errorType === 'UNCLASSIFIED'
              ? <span className="src-pill" style={{background:'var(--slate-100)', color:'var(--slate-700)'}}>Procesando…</span>
              : <span className="src-pill" style={{background:'#FFEFCD', color:'var(--error-fg)'}}>{a.errorType}</span>}
          <span className={`src-pill ${src}`}>{srcLabel}</span>
          {a.confidence !== null && a.errorType !== 'UNCLASSIFIED' && (
            <span className="src-pill" style={{background:'var(--slate-50)', color:'var(--fg-2)'}}>conf {(a.confidence*100).toFixed(0)}%</span>
          )}
          <span className="src-pill" style={{background:'var(--slate-50)', color:'var(--fg-2)'}}>{a.latencyMs}ms</span>
        </div>
      </div>

      <div className="ad-section">
        <div className="ad-cols">
          <div>
            <h3>Problema</h3>
            <div className="ad-prob">{`${a.expr.split(' ')[0]}\n−${a.expr.split(' ')[2]}\n———\n${a.studentAns}`}</div>
            <div className="t-caption" style={{marginTop:8}}>respuesta esperada: <strong className="math">{a.expected}</strong></div>
          </div>
          <div>
            <h3>rawSteps · keystroke replay</h3>
            <div className="col gap-2">
              {a.rawSteps.map((s, i) => (
                <div key={i} className={`ad-step ${!s.ok ? 'bad' : ''}`}>
                  <span className="n">{i+1}</span>
                  <span className="ex" style={{whiteSpace:'pre-wrap'}}>{s.expr}</span>
                  <span className="ts">+{s.t}ms</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {a.evidence.length > 0 && (
        <div className="ad-section">
          <h3>Evidencia del clasificador</h3>
          <div className="ad-evidence">
            <ul style={{margin:0, paddingLeft:18}}>
              {a.evidence.map((e, i) => <li key={i}>{e}</li>)}
            </ul>
            {a.llmCitation && (
              <div className="ad-quote">
                <div className="lab">Claude Haiku 4.5 · tool_use response</div>
                <div style={{fontFamily:'ui-monospace,monospace'}}>
                  classify_errors({'{'}<br/>
                  &nbsp;&nbsp;error_type: <span style={{color:'#8E5BC9'}}>"BORROW_FROM_ZERO_ERROR"</span>,<br/>
                  &nbsp;&nbsp;confidence: <span style={{color:'#8E5BC9'}}>0.81</span>,<br/>
                  &nbsp;&nbsp;evidence: <span style={{color:'#8E5BC9'}}>[3 items]</span><br/>
                  {'}'}) · cache_hit {a.llmCitation.cached} tok · fresh {a.llmCitation.fresh} tok · ${a.llmCitation.costUsd.toFixed(4)} · batch {a.llmCitation.batchSize}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      <div className="ad-section">
        <h3>Actualización BKT</h3>
        <div className="ad-bkt">
          <div className="ad-bkt-cell">
            <div className="lab">P(known) antes</div>
            <div className="v">{(a.bkt.before*100).toFixed(0)}%</div>
          </div>
          <div className="ad-bkt-cell">
            <div className="lab">P(known) después</div>
            <div className="v">
              {(a.bkt.after*100).toFixed(0)}%
              <span className="delta" style={{color: a.bkt.after >= a.bkt.before ? 'var(--mint-700)' : 'var(--error-fg)', marginLeft:6}}>
                {a.bkt.after >= a.bkt.before ? '↑' : '↓'} {Math.abs((a.bkt.after - a.bkt.before)*100).toFixed(0)}pp
              </span>
            </div>
          </div>
          <div className="ad-bkt-cell">
            <div className="lab">p_slip</div>
            <div className="v">{a.bkt.pS.toFixed(2)}</div>
          </div>
          <div className="ad-bkt-cell">
            <div className="lab">p_guess</div>
            <div className="v">{a.bkt.pG.toFixed(2)}</div>
          </div>
        </div>
      </div>

      <div className="ad-section">
        <div className="ad-actions">
          <button className="btn btn-ghost"><Icon name="x" size={14}/> Marcar mal clasificado</button>
          <button className="btn btn-ghost"><Icon name="user" size={14}/> Override manual (HUMAN)</button>
          <button className="btn btn-ghost"><Icon name="refresh" size={14}/> Reclasificar con LLM</button>
          <button className="btn btn-primary" style={{marginLeft:'auto'}}><Icon name="send" size={14}/> Asignar refuerzo</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [selId, setSelId] = useState(ATTEMPTS[2].id);
  const sel = ATTEMPTS.find(a => a.id === selId);
  return (
    <div className="ad-shell" data-screen-label="Teacher · Attempt detail">
      <div className="ad-head">
        <div>
          <h1>Detalle de intento</h1>
          <div className="t-caption">Antonia F. · 4° A · últimos 5 intentos · GET <code style={{fontFamily:'ui-monospace,monospace'}}>/attempts/:id</code></div>
        </div>
        <div className="row gap-2">
          <button className="btn btn-ghost"><Icon name="filter" size={14}/> Filtrar</button>
          <button className="btn btn-ghost"><Icon name="download" size={14}/> Exportar</button>
        </div>
      </div>

      <div className="ad-grid">
        <aside className="ad-list">
          {ATTEMPTS.map(a => (
            <div key={a.id} className={`ad-list-row ${a.id === selId ? 'is-sel' : ''}`} onClick={() => setSelId(a.id)}>
              <span className={`ad-dot ${dotClass(a)}`}/>
              <div style={{flex:1, minWidth:0}}>
                <div className="nm">{a.studentName}</div>
                <div className="ts">{a.ts} · <span className="math">{a.expr}</span> = {a.studentAns}</div>
              </div>
              <span className="et">{a.errorType ?? (a.isCorrect ? '✓' : '?')}</span>
            </div>
          ))}
        </aside>

        <Detail a={sel}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
