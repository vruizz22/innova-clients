<!doctype html>
<!-- @dsCard group="UI Kit — Practice" name="Practice App" subtitle="SuperProfes student app · problem → keypad → feedback (clickable)" viewport="600x1000" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<title>SuperProfes · Practice (Student)</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-100); display: grid; place-items: start center; padding: 32px 16px; min-height: 100vh; }
  .stage { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .nav button { padding: 8px 14px; border-radius: 9999px; border: 1px solid var(--border-strong); background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .nav button.is-active { background: var(--slate-800); color: #fff; border-color: var(--slate-800); }
  .label { color: var(--fg-2); font-size: 12px; text-align: center; margin-top: 8px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel" src="../shared/ios-frame.jsx"></script>
<script type="text/babel" src="PracticeComponents.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function HomeScreen({ onPick, onScan }) {
  return (
    <div className="p-app">
      <PracticeHeader/>
      <main className="p-content">
        <div>
          <div className="t-caption" style={{marginBottom:6}}>Hola, Antonia</div>
          <h1 style={{margin:0, fontSize:28, fontWeight:700, letterSpacing:'-0.02em'}}>Tu próxima práctica</h1>
        </div>
        <div className="p-lesson" onClick={() => onPick('subtraction_borrow')}>
          <div className="p-lesson-icon"><Icon name="book" size={20}/></div>
          <div>
            <div className="title">Resta con reserva</div>
            <div className="sub">15 problemas · ~10 min</div>
          </div>
          <span className="badge">Asignado</span>
        </div>
        <div className="p-lesson" onClick={() => onPick('addition_carry')}>
          <div className="p-lesson-icon"><Icon name="book" size={20}/></div>
          <div>
            <div className="title">Suma con llevadas</div>
            <div className="sub">10 problemas · ~6 min</div>
          </div>
          <span style={{color:'var(--fg-2)'}}><Icon name="chevron-right" size={18}/></span>
        </div>

        <ScanCTA onScan={onScan}/>

        <div className="p-lessons" style={{marginTop:8}}>
          <h3>Habilidades</h3>
          <div className="p-lesson">
            <div className="p-lesson-icon" style={{background:'var(--sky-100)',color:'var(--sky-800)'}}><Icon name="chart" size={20}/></div>
            <div>
              <div className="title">Tu progreso</div>
              <div className="sub">3 habilidades dominadas</div>
            </div>
            <span style={{color:'var(--fg-2)'}}><Icon name="chevron-right" size={18}/></span>
          </div>
        </div>
      </main>
    </div>
  );
}

function ProblemScreen({ onSubmit, onBack }) {
  const [val, setVal] = useState('');
  const onKey = (k) => {
    if (k === 'del') setVal(val.slice(0, -1));
    else if (k === 'done') onSubmit(val);
    else if (val.length < 4) setVal(val + k);
  };
  return (
    <div className="p-app">
      <PracticeHeader/>
      <main className="p-content">
        <button className="btn btn-ghost" onClick={onBack} style={{alignSelf:'flex-start'}}>
          <Icon name="chevron-left" size={16}/> Volver
        </button>
        <ProblemDisplay a={53} b={26} op="−" answer={val}/>
        <div className="p-caption" style={{textAlign:'center'}}>
          <span className="t-caption">Escribe el resultado de la resta.</span>
        </div>
      </main>
      <Keypad onKey={onKey}/>
    </div>
  );
}

function FeedbackScreen({ correct, onNext }) {
  return (
    <div className="p-app">
      <PracticeHeader/>
      <main className="p-content" style={{justifyContent:'center'}}>
        {correct
          ? <FeedbackCorrect onNext={onNext}/>
          : <FeedbackError onRetry={onNext}/>}
      </main>
    </div>
  );
}

function ScannerScreen({ onDone, onCancel }) {
  const [status, setStatus] = useState('idle');
  const capture = () => {
    setStatus('processing');
    setTimeout(() => setStatus('done'), 1800);
  };
  return (
    <div className="p-app">
      <PracticeHeader/>
      <ScannerView status={status} onCapture={capture} onCancel={onCancel} onContinue={onDone}/>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('home');
  const [tab, setTab] = useState('home');

  // tab acts like an index for the demo
  useEffect(() => {
    setScreen(tab);
  }, [tab]);

  const node = (() => {
    switch (screen) {
      case 'home':     return <HomeScreen onPick={() => setScreen('problem')} onScan={() => setScreen('scan')}/>;
      case 'problem':  return <ProblemScreen onBack={() => setScreen('home')} onSubmit={(v) => setScreen(v === '27' ? 'good' : 'bad')}/>;
      case 'good':     return <FeedbackScreen correct onNext={() => setScreen('home')}/>;
      case 'bad':      return <FeedbackScreen onNext={() => setScreen('problem')}/>;
      case 'scan':     return <ScannerScreen onCancel={() => setScreen('home')} onDone={() => setScreen('good')}/>;
      default:         return null;
    }
  })();

  return (
    <div>
      <div className="nav">
        {['home','problem','bad','good','scan'].map(t => (
          <button key={t} className={tab === t ? 'is-active' : ''} onClick={() => setTab(t)}>{t}</button>
        ))}
      </div>
      <div className="stage">
        <div>
          <IOSDevice width={390} height={780}>
            {node}
          </IOSDevice>
          <div className="label">Pruébalo: home → asignado → escribe 27 (correcto) o 33 (error procedural)</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
