<!doctype html>
<!-- @dsCard group="UI Kit — Teacher" name="Teacher · Asignar práctica" subtitle="Flujo de asignación de práctica a un curso" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>SuperProfes · Asignar práctica</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: var(--slate-50); margin: 0; }
  .ap-shell { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .ap-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 0 rgba(15,42,61,.04); }
  .ap-head { padding: 24px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .ap-stepper { display: flex; align-items: center; gap: 12px; }
  .ap-step { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 13px; font-weight: 600; }
  .ap-step .dot { width: 24px; height: 24px; border-radius: 9999px; background: var(--slate-100); color: var(--fg-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .ap-step.is-active { color: var(--fg-1); }
  .ap-step.is-active .dot { background: var(--slate-800); color: #fff; }
  .ap-step.is-done .dot { background: var(--mint-500); color: #fff; }
  .ap-step .bar { width: 32px; height: 2px; background: var(--border); }
  .ap-body { padding: 28px; min-height: 480px; }
  .ap-foot { padding: 16px 28px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

  .ap-roster { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ap-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .ap-row:hover { background: var(--slate-50); }
  .ap-row.is-sel { background: var(--sky-50); border-color: var(--sky-300); }
  .ap-row .avatar { width: 32px; height: 32px; border-radius: 9999px; background: var(--slate-100); color: var(--slate-700); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .ap-row .meta { flex: 1; }
  .ap-row .nm { font-weight: 600; font-size: 14px; color: var(--fg-1); }
  .ap-row .sk { font-size: 12px; color: var(--fg-2); }
  .ap-row .pkn { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; }

  .ap-skill { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .ap-skill.is-sel { border-color: var(--sky-500); background: var(--sky-50); }
  .ap-skill .sk-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--slate-100); display: grid; place-items: center; color: var(--slate-700); }
  .ap-skill .nm { font-weight: 700; font-size: 15px; color: var(--fg-1); }
  .ap-skill .desc { font-size: 12px; color: var(--fg-2); }

  .ap-grid-rev { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .ap-pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ap-pill { padding: 4px 10px; border-radius: 9999px; background: var(--slate-100); color: var(--fg-1); font-size: 12px; font-weight: 600; }
  .ap-fisher { background: var(--slate-50); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .ap-fisher h4 { margin: 0 0 6px; font-size: 13px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; }
  .ap-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .ap-item:last-child { border-bottom: 0; }
  .ap-item .id { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--fg-2); }
  .ap-item .ex { font-weight: 600; flex: 1; }
  .ap-item .ab { font-size: 11px; color: var(--fg-2); font-family: ui-monospace, monospace; }
  .ap-item .info { font-size: 11px; padding: 2px 8px; border-radius: 9999px; background: var(--mint-50); color: var(--mint-700); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>

<script type="text/babel">
const { useState, useMemo } = React;

const STUDENTS = [
  { id: 's1', name: 'Antonia Fuentes',   pk: 0.32, alert: true },
  { id: 's2', name: 'Benjamín Soto',     pk: 0.41, alert: true },
  { id: 's3', name: 'Catalina Pérez',    pk: 0.55, alert: false },
  { id: 's4', name: 'Diego Vega',        pk: 0.28, alert: true },
  { id: 's5', name: 'Emilia Rojas',      pk: 0.74, alert: false },
  { id: 's6', name: 'Felipe Núñez',      pk: 0.62, alert: false },
  { id: 's7', name: 'Gabriela Toro',     pk: 0.44, alert: true },
  { id: 's8', name: 'Hugo Ramírez',      pk: 0.81, alert: false },
];

const SKILLS = [
  { key: 'subtraction_borrow',     name: 'Resta con reserva',         desc: '3°–4° básico · 9 patrones de error catalogados' },
  { key: 'addition_carry',         name: 'Suma con llevadas',         desc: '3°–4° básico · 4 patrones de error' },
  { key: 'multiplication_table',   name: 'Tablas de multiplicar',     desc: '3°–4° básico · hechos básicos' },
  { key: 'long_division',          name: 'División larga',            desc: '5°–6° básico · 7 patrones de error' },
];

// Fisher info I(θ) = a²·P(θ)·(1−P(θ)) — pick item that maximizes I at student's current θ
const ITEM_BANK = [
  { id: 'it_001', expr: '53 − 26', a: 1.4, b: -0.2 },
  { id: 'it_002', expr: '82 − 47', a: 1.6, b:  0.1 },
  { id: 'it_003', expr: '40 − 18', a: 1.2, b: -0.5 },
  { id: 'it_004', expr: '305 − 178', a: 1.8, b:  0.6 },
  { id: 'it_005', expr: '700 − 234', a: 1.7, b:  0.9 },
  { id: 'it_006', expr: '60 − 27', a: 1.3, b: -0.3 },
  { id: 'it_007', expr: '903 − 487', a: 2.0, b:  1.1 },
];
function fisher(item, theta) {
  const z = item.a * (theta - item.b);
  const p = 1 / (1 + Math.exp(-z));
  return item.a * item.a * p * (1 - p);
}

function pkColor(p) {
  if (p >= 0.7) return { bg: 'var(--mint-100)', fg: 'var(--mint-700)' };
  if (p >= 0.4) return { bg: '#FFEFCD', fg: 'var(--error-fg)' };
  return { bg: '#FAD9D9', fg: '#7A2E2E' };
}

function StudentRow({ st, sel, onToggle }) {
  const c = pkColor(st.pk);
  const initials = st.name.split(' ').map(s => s[0]).slice(0, 2).join('');
  return (
    <div className={`ap-row ${sel ? 'is-sel' : ''}`} onClick={onToggle}>
      <input type="checkbox" checked={sel} onChange={() => {}} style={{accentColor:'var(--sky-500)'}}/>
      <div className="avatar">{initials}</div>
      <div className="meta">
        <div className="nm">{st.name}</div>
        <div className="sk">Resta con reserva · {st.alert ? 'alerta activa' : 'sin alertas'}</div>
      </div>
      <span className="pkn" style={{background: c.bg, color: c.fg}}>{(st.pk*100).toFixed(0)}%</span>
    </div>
  );
}

function StepStudents({ selStudents, setSelStudents }) {
  const toggle = (id) => setSelStudents(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const allAlerts = () => setSelStudents(STUDENTS.filter(s => s.alert).map(s => s.id));
  const all = () => setSelStudents(STUDENTS.map(s => s.id));
  const none = () => setSelStudents([]);
  return (
    <div>
      <div className="row gap-2" style={{justifyContent:'space-between', marginBottom:12}}>
        <div>
          <h2 style={{margin:0, fontSize:18}}>¿A quién le asignas práctica?</h2>
          <div className="t-caption" style={{marginTop:4}}>4° A · 8 alumnos · 3 con alertas pendientes</div>
        </div>
        <div className="row gap-2">
          <button className="btn btn-ghost" onClick={allAlerts}>Solo con alertas</button>
          <button className="btn btn-ghost" onClick={all}>Todos</button>
          <button className="btn btn-ghost" onClick={none}>Limpiar</button>
        </div>
      </div>
      <div className="ap-roster">
        {STUDENTS.map(st => (
          <StudentRow key={st.id} st={st} sel={selStudents.includes(st.id)} onToggle={() => toggle(st.id)}/>
        ))}
      </div>
    </div>
  );
}

function StepSkill({ skillKey, setSkillKey }) {
  return (
    <div>
      <h2 style={{margin:'0 0 12px', fontSize:18}}>¿Qué habilidad practicar?</h2>
      <div className="t-caption" style={{marginBottom:14}}>El sistema elige los items con <strong>Fisher information</strong>: maximiza el aprendizaje al nivel de dominio actual del alumno.</div>
      <div className="col gap-3">
        {SKILLS.map(sk => (
          <div key={sk.key} className={`ap-skill ${sk.key === skillKey ? 'is-sel' : ''}`} onClick={() => setSkillKey(sk.key)}>
            <div className="sk-icon"><Icon name="book" size={20}/></div>
            <div style={{flex:1}}>
              <div className="nm">{sk.name}</div>
              <div className="desc">{sk.desc}</div>
            </div>
            {sk.key === skillKey && <div style={{color:'var(--sky-600)'}}><Icon name="check" size={20}/></div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function StepReview({ selStudents, skillKey, due, setDue }) {
  const skill = SKILLS.find(s => s.key === skillKey);
  const sts = STUDENTS.filter(s => selStudents.includes(s.id));
  // Group fisher pick by student average θ — for demo: avgPk → θ ≈ logit(pk)
  const picks = useMemo(() => {
    return sts.slice(0, 3).map(st => {
      const pk = Math.min(0.99, Math.max(0.01, st.pk));
      const theta = Math.log(pk / (1 - pk));
      const ranked = ITEM_BANK
        .map(it => ({ ...it, info: fisher(it, theta) }))
        .sort((a, b) => b.info - a.info);
      return { st, theta, ranked: ranked.slice(0, 4) };
    });
  }, [selStudents]);

  return (
    <div>
      <h2 style={{margin:'0 0 12px', fontSize:18}}>Revisar y enviar</h2>
      <div className="ap-grid-rev">
        <div className="col gap-3">
          <div className="ap-fisher">
            <h4>Resumen</h4>
            <div className="row gap-3" style={{justifyContent:'space-between', alignItems:'flex-start'}}>
              <div className="col gap-2">
                <div><strong>{skill.name}</strong></div>
                <div className="t-caption">{sts.length} alumnos · ~12 problemas por alumno · auto-adaptado</div>
              </div>
              <div className="col gap-2" style={{alignItems:'flex-end'}}>
                <label className="t-caption">Vence</label>
                <input type="date" value={due} onChange={e => setDue(e.target.value)} className="input" style={{padding:'6px 10px', borderRadius:8, border:'1px solid var(--border-strong)', fontFamily:'inherit'}}/>
              </div>
            </div>
            <div className="divider"/>
            <h4>Alumnos</h4>
            <div className="ap-pill-row">
              {sts.map(s => <span key={s.id} className="ap-pill">{s.name.split(' ')[0]} · {(s.pk*100).toFixed(0)}%</span>)}
            </div>
          </div>
        </div>

        <div>
          <div className="ap-fisher">
            <h4>Items elegidos por Fisher information</h4>
            <div className="t-caption" style={{marginBottom:8}}>Por cada alumno, items que maximizan I(θ) = a²·P(θ)·(1−P(θ)) en su θ actual.</div>
            {picks.map(({ st, ranked }) => (
              <div key={st.id} style={{marginBottom:12}}>
                <div className="t-caption" style={{fontWeight:700, color:'var(--fg-1)', marginBottom:4}}>{st.name} · θ ≈ {(Math.log(st.pk/(1-st.pk))).toFixed(2)}</div>
                {ranked.map(it => (
                  <div className="ap-item" key={it.id}>
                    <span className="id">{it.id}</span>
                    <span className="ex math">{it.expr}</span>
                    <span className="ab">a={it.a.toFixed(1)} · b={it.b.toFixed(1)}</span>
                    <span className="info">I={it.info.toFixed(2)}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [selStudents, setSelStudents] = useState(['s1','s2','s4','s7']);
  const [skillKey, setSkillKey] = useState('subtraction_borrow');
  const [due, setDue] = useState('2026-05-12');
  const [done, setDone] = useState(false);

  const STEPS = [
    { id: 0, label: 'Alumnos' },
    { id: 1, label: 'Habilidad' },
    { id: 2, label: 'Revisar' },
  ];

  const next = () => step < 2 ? setStep(step+1) : setDone(true);
  const back = () => step > 0 && setStep(step-1);
  const canNext = step === 0 ? selStudents.length > 0 : step === 1 ? !!skillKey : true;

  return (
    <div className="ap-shell" data-screen-label={`Teacher · Assign Practice · step ${step+1}`}>
      <div className="ap-card">
        <div className="ap-head">
          <div>
            <h1 style={{margin:0, fontSize:22, letterSpacing:'-0.01em'}}>Asignar práctica adaptativa</h1>
            <div className="t-caption" style={{marginTop:4}}>POST <code style={{fontFamily:'ui-monospace,monospace'}}>/practice/assign</code> · Fisher information item picker</div>
          </div>
          <div className="ap-stepper">
            {STEPS.map((s, i) => (
              <React.Fragment key={s.id}>
                <div className={`ap-step ${step === i ? 'is-active' : step > i ? 'is-done' : ''}`}>
                  <div className="dot">{step > i ? '✓' : i+1}</div>
                  <span>{s.label}</span>
                </div>
                {i < STEPS.length-1 && <div className="bar"/>}
              </React.Fragment>
            ))}
          </div>
        </div>
        <div className="ap-body">
          {done
            ? (
              <div style={{display:'grid', placeItems:'center', minHeight:380, textAlign:'center'}}>
                <div>
                  <div style={{width:64, height:64, borderRadius:9999, background:'var(--mint-100)', display:'grid', placeItems:'center', margin:'0 auto 16px', color:'var(--mint-700)'}}>
                    <Icon name="check" size={32}/>
                  </div>
                  <h2 style={{margin:'0 0 6px'}}>Práctica asignada</h2>
                  <div className="t-caption">{selStudents.length} alumnos recibirán {SKILLS.find(s=>s.key===skillKey).name} hoy. Vence {due}.</div>
                  <button className="btn btn-primary" style={{marginTop:18}} onClick={() => { setDone(false); setStep(0); }}>Asignar otra</button>
                </div>
              </div>
            )
            : step === 0 ? <StepStudents selStudents={selStudents} setSelStudents={setSelStudents}/>
            : step === 1 ? <StepSkill skillKey={skillKey} setSkillKey={setSkillKey}/>
            : <StepReview selStudents={selStudents} skillKey={skillKey} due={due} setDue={setDue}/>
          }
        </div>
        {!done && (
          <div className="ap-foot">
            <button className="btn btn-ghost" onClick={back} disabled={step === 0}>← Atrás</button>
            <div className="t-caption">{selStudents.length} alumnos · {SKILLS.find(s=>s.key===skillKey)?.name}</div>
            <button className="btn btn-primary" onClick={next} disabled={!canNext}>
              {step < 2 ? 'Siguiente →' : 'Asignar a ' + selStudents.length + ' alumnos'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
