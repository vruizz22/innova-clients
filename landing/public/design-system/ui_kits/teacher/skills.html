<!doctype html>
<!-- @dsCard group="UI Kit — Teacher" name="Teacher · Skills" subtitle="Vista de habilidades y dominio del curso" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>SuperProfes · Skills</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background:var(--slate-50); margin:0; }
  .sk-shell { max-width:1180px; margin:0 auto; padding:28px 24px; }
  .sk-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }
  .sk-head h1 { margin:0; font-size:24px; letter-spacing:-.01em; }
  .sk-grid { display:grid; grid-template-columns:1fr 380px; gap:18px; align-items:start; }
  .sk-table-wrap { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-2); padding:10px 16px; border-bottom:1px solid var(--border); font-weight:700; }
  td { padding:13px 16px; border-bottom:1px solid var(--border); font-size:14px; }
  tr:last-child td { border-bottom:0; }
  tr.is-sel { background:var(--sky-50); }
  tr:hover:not(.is-sel) { background:var(--slate-50); cursor:pointer; }
  .mono { font-family:ui-monospace,monospace; font-size:12px; color:var(--fg-2); }
  .sk-detail { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; }
  .sk-detail h3 { margin:0 0 16px; font-size:16px; }
  .sk-field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .sk-field label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-2); }
  .sk-input { padding:10px 13px; border-radius:10px; border:1.5px solid var(--border-strong); font:inherit; font-size:14px; }
  .sk-input:focus { outline:2px solid var(--sky-400); outline-offset:0; }
  .sk-prereq { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .sk-prereq-pill { display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:var(--slate-100); font-size:12px; font-weight:600; }
  .sk-prereq-pill button { background:none; border:0; cursor:pointer; color:var(--fg-2); font-size:14px; padding:0; }
  .sk-actions { display:flex; gap:8px; margin-top:4px; }
  .confirm-banner { background:#FAD9D9; border:1px solid #F5B3B3; border-radius:10px; padding:12px 14px; font-size:13px; color:#7A2E2E; margin-top:12px; }
  .confirm-banner .btns { display:flex; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SEED = [
  { id:'sk1', key:'subtraction_borrow',   name:'Resta con reserva',       desc:'3°–4° básico · 9 patrones de error en rule engine', items:24 },
  { id:'sk2', key:'addition_carry',       name:'Suma con llevadas',       desc:'3°–4° básico · 4 patrones de error', items:18 },
  { id:'sk3', key:'multiplication_table', name:'Tablas de multiplicar',   desc:'3°–4° básico', items:30 },
  { id:'sk4', key:'long_division',        name:'División larga',          desc:'5°–6° básico · 7 patrones de error', items:12 },
  { id:'sk5', key:'fractions_same_denom', name:'Fracciones mismo denom.', desc:'5° básico', items:8 },
  { id:'sk6', key:'fractions_diff_denom', name:'Fracciones denom. dist.', desc:'6° básico', items:6 },
];

function SkillForm({ skill, onSave, onCancel }) {
  const [key, setKey]   = useState(skill?.key ?? '');
  const [name, setName] = useState(skill?.name ?? '');
  const [desc, setDesc] = useState(skill?.desc ?? '');
  const isNew = !skill;
  const valid = key.trim() && name.trim();
  return (
    <div className="sk-detail">
      <h3>{isNew ? 'Nueva habilidad' : 'Editar habilidad'}</h3>
      <div className="sk-field">
        <label>key <span style={{color:'var(--sky-600)'}}>*</span></label>
        <input className="sk-input" value={key} onChange={e=>setKey(e.target.value.toLowerCase().replace(/\s+/g,'_'))} placeholder="subtraction_borrow" readOnly={!isNew} style={{fontFamily:'ui-monospace,monospace'}}/>
        {!isNew && <span style={{fontSize:11,color:'var(--fg-3)'}}>El key no se puede cambiar una vez creado.</span>}
      </div>
      <div className="sk-field">
        <label>Nombre <span style={{color:'var(--sky-600)'}}>*</span></label>
        <input className="sk-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Resta con reserva"/>
      </div>
      <div className="sk-field">
        <label>Descripción</label>
        <input className="sk-input" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="3°–4° básico · ..."/>
      </div>
      <div className="sk-field">
        <label>Prerequisitos · GET /skills/{'{id}'}/prerequisites</label>
        <div className="sk-prereq">
          <span className="sk-prereq-pill">subtraction_borrow <button>×</button></span>
          <button className="btn btn-ghost" style={{minHeight:28,padding:'4px 10px',fontSize:12}}><Icon name="plus" size={12}/> Agregar</button>
        </div>
      </div>
      <div className="sk-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" disabled={!valid} onClick={()=>onSave({key,name,desc})}>
          {isNew?'Crear habilidad (POST /skills)':'Guardar (PATCH /skills/:id)'}
        </button>
      </div>
    </div>
  );
}

function DeleteConfirm({ skill, onConfirm, onCancel }) {
  return (
    <div className="sk-detail">
      <h3>Eliminar habilidad</h3>
      <p style={{fontSize:14,color:'var(--fg-1)'}}>¿Seguro que quieres eliminar <strong>{skill.name}</strong>? Se eliminarán también los {skill.items} items asociados. Esta acción no se puede deshacer.</p>
      <div style={{display:'flex',gap:8,marginTop:8}}>
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn" style={{background:'var(--mastery-weak)',color:'#fff',border:0}} onClick={onConfirm}>Eliminar (DELETE /skills/{skill.id})</button>
      </div>
    </div>
  );
}

function App() {
  const [skills, setSkills]   = useState(SEED);
  const [selId,  setSelId]    = useState(null);
  const [mode, setMode]       = useState('view'); // view | edit | new | delete
  const sel = skills.find(s=>s.id===selId);

  const save = (data) => {
    if (mode==='new') {
      setSkills(ss=>[...ss,{id:'sk'+Date.now(),...data,items:0}]);
    } else {
      setSkills(ss=>ss.map(s=>s.id===selId?{...s,...data}:s));
    }
    setMode('view'); setSelId(null);
  };
  const del = () => {
    setSkills(ss=>ss.filter(s=>s.id!==selId));
    setSelId(null); setMode('view');
  };

  return (
    <div className="sk-shell" data-screen-label="Teacher · Skills CRUD">
      <div className="sk-head">
        <div><h1>Catálogo de habilidades</h1><div className="t-caption">GET/POST/PATCH/DELETE <code style={{fontFamily:'ui-monospace,monospace'}}>/skills</code> · {skills.length} habilidades</div></div>
        <button className="btn btn-primary" onClick={()=>{setSelId(null);setMode('new')}}><Icon name="plus" size={14}/> Nueva habilidad</button>
      </div>
      <div className="sk-grid">
        <div className="sk-table-wrap">
          <table>
            <thead><tr><th>Key</th><th>Nombre</th><th>Descripción</th><th style={{textAlign:'right'}}>Items</th><th></th></tr></thead>
            <tbody>
              {skills.map(s=>(
                <tr key={s.id} className={selId===s.id?'is-sel':''} onClick={()=>{setSelId(s.id);setMode('view');}}>
                  <td className="mono">{s.key}</td>
                  <td style={{fontWeight:600}}>{s.name}</td>
                  <td style={{color:'var(--fg-2)',fontSize:13}}>{s.desc}</td>
                  <td className="mono" style={{textAlign:'right'}}>{s.items}</td>
                  <td>
                    <div className="row gap-2">
                      <button className="btn btn-ghost" style={{minHeight:30,padding:'4px 8px'}} onClick={e=>{e.stopPropagation();setSelId(s.id);setMode('edit');}}>
                        <Icon name="settings" size={13}/>
                      </button>
                      <button className="btn btn-ghost" style={{minHeight:30,padding:'4px 8px',color:'var(--mastery-weak)'}} onClick={e=>{e.stopPropagation();setSelId(s.id);setMode('delete');}}>
                        <Icon name="x" size={13}/>
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <aside>
          {mode==='new'    && <SkillForm onSave={save} onCancel={()=>setMode('view')}/>}
          {mode==='edit'   && sel && <SkillForm skill={sel} onSave={save} onCancel={()=>setMode('view')}/>}
          {mode==='delete' && sel && <DeleteConfirm skill={sel} onConfirm={del} onCancel={()=>setMode('view')}/>}
          {mode==='view'   && sel && (
            <div className="sk-detail">
              <h3>Detalle</h3>
              <div className="t-caption" style={{fontFamily:'ui-monospace,monospace',marginBottom:8}}>{sel.key}</div>
              <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>{sel.name}</div>
              <div style={{color:'var(--fg-2)',fontSize:14,marginBottom:16}}>{sel.desc}</div>
              <div style={{background:'var(--slate-50)',borderRadius:10,padding:12}}>
                <div className="t-caption" style={{fontWeight:700,color:'var(--fg-1)',marginBottom:6}}>GET /skills/{sel.id}/prerequisites</div>
                <div style={{fontSize:13,color:'var(--fg-2)'}}>Sin prerequisitos configurados.</div>
              </div>
              <div className="row gap-2" style={{marginTop:14}}>
                <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setMode('edit')}><Icon name="settings" size={14}/> Editar</button>
                <button className="btn btn-ghost" style={{flex:1,color:'var(--mastery-weak)'}} onClick={()=>setMode('delete')}><Icon name="x" size={14}/> Eliminar</button>
              </div>
            </div>
          )}
          {mode==='view' && !sel && (
            <div style={{background:'#fff',border:'1px dashed var(--border-strong)',borderRadius:14,padding:28,textAlign:'center',color:'var(--fg-2)'}}>
              <Icon name="book" size={28}/>
              <p style={{margin:'10px 0 0',fontSize:14}}>Selecciona una habilidad o crea una nueva.</p>
            </div>
          )}
        </aside>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
