<!doctype html>
<!-- @dsCard group="UI Kit — Practice" name="Practice · Web" subtitle="Vista web de práctica de problemas" viewport="1280x900" -->
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperProfes · Practice Web</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<style>
  body { margin:0; background:var(--bg-student); font-family:var(--font-sans); }

  /* ── Nav ── */
  .pr-nav { position:sticky; top:0; z-index:20; background:rgba(240,247,251,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 24px; height:58px; }
  .pr-logo { font-weight:700; font-size:15px; color:var(--fg-1); display:flex; align-items:center; gap:8px; }
  .pr-logo .mark { width:30px; height:30px; border-radius:8px; background:var(--sky-600); display:grid; place-items:center; color:#fff; font-weight:800; font-size:12px; }
  .pr-tabs { display:flex; gap:4px; flex:1; justify-content:center; }
  .pr-tab { padding:8px 16px; border-radius:8px; border:0; background:transparent; font:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--fg-2); }
  .pr-tab.is-active { background:var(--sky-100); color:var(--sky-800); }
  .pr-avatar { width:32px; height:32px; border-radius:9999px; background:var(--sky-400); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; }

  .pr-shell { max-width:800px; margin:0 auto; padding:28px 20px 60px; }

  /* Home */
  .pr-greeting { margin-bottom:20px; }
  .pr-greeting h1 { margin:0 0 4px; font-size:28px; font-weight:700; letter-spacing:-.02em; }
  .pr-greeting p { margin:0; color:var(--fg-2); font-size:15px; }

  .pr-lesson { display:flex; align-items:center; gap:14px; padding:16px; background:#fff; border:1px solid var(--border); border-radius:14px; cursor:pointer; transition:box-shadow .15s; }
  .pr-lesson:hover { box-shadow:var(--shadow-pop); }
  .pr-lesson + .pr-lesson { margin-top:10px; }
  .pr-lesson .ico { width:44px; height:44px; border-radius:12px; background:var(--sky-100); color:var(--sky-700); display:grid; place-items:center; flex-shrink:0; }
  .pr-lesson .nm { font-weight:700; font-size:15px; }
  .pr-lesson .sub { font-size:13px; color:var(--fg-2); }
  .pr-badge { padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:700; background:var(--sky-500); color:#fff; margin-left:auto; white-space:nowrap; }

  /* Scan CTA */
  .pr-scan { margin-top:16px; display:flex; align-items:center; gap:14px; padding:16px; background:linear-gradient(135deg,var(--sky-700),var(--sky-800)); border-radius:14px; color:#fff; cursor:pointer; }
  .pr-scan .ico { width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.15); display:grid; place-items:center; flex-shrink:0; }
  .pr-scan .nm { font-weight:700; font-size:15px; }
  .pr-scan .sub { font-size:13px; opacity:.8; }

  /* Problem */
  .pr-problem { background:#fff; border:1px solid var(--border); border-radius:20px; padding:32px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .pr-problem-display { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums slashed-zero; font-size:48px; font-weight:700; text-align:right; line-height:1.3; color:var(--fg-1); }
  .pr-problem-input { font-family:ui-monospace,monospace; font-size:40px; font-weight:700; color:var(--sky-700); min-width:100px; text-align:center; padding:8px 20px; background:var(--sky-50); border:2px solid var(--sky-300); border-radius:12px; }
  .pr-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:320px; }
  .pr-key { height:56px; border-radius:12px; border:1.5px solid var(--border); background:#fff; font-family:ui-monospace,monospace; font-size:22px; font-weight:700; cursor:pointer; transition:background .1s,transform .1s; display:grid; place-items:center; }
  .pr-key:hover { background:var(--sky-50); }
  .pr-key:active { transform:scale(.95); }
  .pr-key.del { font-size:14px; background:var(--slate-50); }
  .pr-key.done { background:var(--sky-600); color:#fff; border-color:var(--sky-600); font-size:14px; }
  .pr-progress { width:100%; height:6px; background:var(--slate-100); border-radius:9999px; overflow:hidden; }
  .pr-progress-fill { height:100%; background:var(--sky-500); border-radius:9999px; }

  /* Feedback */
  .pr-feedback { padding:32px 24px; display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
  .pr-fb-icon { width:80px; height:80px; border-radius:9999px; display:grid; place-items:center; font-size:36px; }

  /* Progress tab */
  .pr-mastery-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .pr-mastery-row:last-child { border-bottom:0; }
  .pr-mastery-row .nm { flex:1; font-weight:600; }
  .pr-mastery-row .bar { flex:2; height:8px; background:var(--slate-100); border-radius:9999px; overflow:hidden; }
  .pr-mastery-row .fill { height:100%; border-radius:9999px; }

  /* Me */
  .pr-me-kv { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .pr-me-kv:last-child { border-bottom:0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/Icon.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SKILLS = [
  { key:'subtraction_borrow', name:'Resta con reserva',   pk:.32 },
  { key:'addition_carry',     name:'Suma con llevadas',   pk:.71 },
  { key:'multiplication',     name:'Multiplicación',       pk:.58 },
  { key:'long_division',      name:'División larga',      pk:.44 },
];
const pkColor = p => p>=.7?'var(--mint-500)':p>=.4?'var(--mastery-medium)':'var(--mastery-weak)';

function HomeTab({ onPractice, onScan }) {
  return (
    <div data-screen-label="Practice web · Home">
      <div className="pr-greeting">
        <h1>Hola, Antonia</h1>
        <p>Tienes 2 prácticas asignadas para hoy.</p>
      </div>
      <div style={{marginBottom:6,fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--fg-2)'}}>Asignadas por tu profe</div>
      <div className="pr-lesson" onClick={()=>onPractice('subtraction_borrow')}>
        <div className="ico"><Icon name="book" size={20}/></div>
        <div><div className="nm">Resta con reserva</div><div className="sub">15 problemas · ~10 min · POST /attempts</div></div>
        <span className="pr-badge">Asignado</span>
      </div>
      <div className="pr-lesson">
        <div className="ico"><Icon name="chart" size={20}/></div>
        <div><div className="nm">Suma con llevadas</div><div className="sub">10 problemas · ~6 min</div></div>
        <span style={{marginLeft:'auto',color:'var(--fg-2)'}}><Icon name="chevron-right" size={18}/></span>
      </div>
      <div className="pr-scan" onClick={onScan}>
        <div className="ico"><Icon name="camera" size={22}/></div>
        <div><div className="nm">Escanear hoja de ejercicios</div><div className="sub">POST /attempts/ocr-extract · Gemini 2.0 Flash</div></div>
        <Icon name="chevron-right" size={18}/>
      </div>
    </div>
  );
}

function PracticeTab({ skillKey, onBack }) {
  const [ans, setAns] = useState('');
  const [done, setDone] = useState(false);
  const [correct, setCorrect] = useState(null);
  const [prob, setProb] = useState(0);
  const PROBLEMS = [{a:53,b:26,op:'−',ans:27},{a:82,b:47,op:'−',ans:35},{a:40,b:18,op:'−',ans:22}];
  const cur = PROBLEMS[prob % PROBLEMS.length];
  const submit = () => { setCorrect(parseInt(ans)===cur.ans); setDone(true); };
  const next = () => { setDone(false); setAns(''); setProb(p=>p+1); };
  const onKey = k => { if(k==='del') setAns(a=>a.slice(0,-1)); else if(k==='done') submit(); else if(ans.length<4) setAns(a=>a+k); };

  return (
    <div data-screen-label="Practice web · Problem">
      <button className="btn btn-ghost" style={{marginBottom:16}} onClick={onBack}><Icon name="chevron-left" size={16}/> Volver</button>
      <div style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontSize:13,color:'var(--fg-2)',fontWeight:600}}>Problema {(prob%3)+1} de 15</span>
          <span style={{fontSize:13,color:'var(--fg-2)'}}>Resta con reserva</span>
        </div>
        <div className="pr-progress"><div className="pr-progress-fill" style={{width:(((prob%3)+1)/3*100)+'%'}}/></div>
      </div>
      {!done ? (
        <div className="pr-problem">
          <div className="pr-problem-display">{`${cur.a}\n${cur.op} ${cur.b}\n${'—'.repeat(5)}`}</div>
          <div className="pr-problem-input">{ans || <span style={{color:'var(--fg-3)'}}>?</span>}</div>
          <div style={{fontSize:13,color:'var(--fg-2)'}}>Escribe el resultado</div>
          <div className="pr-keypad">
            {['7','8','9','4','5','6','1','2','3','del','0','done'].map(k=>(
              <button key={k} className={`pr-key ${k==='del'?'del':''} ${k==='done'?'done':''}`} onClick={()=>onKey(k)}>
                {k==='del'?'⌫':k==='done'?'Listo':k}
              </button>
            ))}
          </div>
        </div>
      ) : (
        <div className="pr-feedback">
          <div className="pr-fb-icon" style={{background:correct?'var(--mint-100)':'var(--error-bg)'}}>
            {correct ? '🟢' : '🟡'}
          </div>
          {correct ? (
            <>
              <div style={{fontSize:22,fontWeight:700,color:'var(--mint-700)'}}>¡Correcto!</div>
              <div style={{color:'var(--fg-2)',fontSize:15}}>Excelente trabajo, Antonia.</div>
            </>
          ) : (
            <>
              <div style={{fontSize:22,fontWeight:700,color:'var(--error-fg)'}}>Casi lo tienes</div>
              <div style={{background:'var(--error-bg)',border:'1px solid var(--error-border)',borderRadius:12,padding:'14px 18px',fontSize:14,color:'var(--error-fg)',lineHeight:1.55,maxWidth:420}}>
                <strong>Fíjate en las decenas.</strong> Cuando el dígito de arriba es menor que el de abajo, hay que pedir prestado a la columna de las decenas.
                <br/><br/>
                <span className="math">{cur.a} − {cur.b} = <strong>{cur.ans}</strong></span> (tu respuesta: {ans})
              </div>
            </>
          )}
          <button className="btn btn-primary" onClick={next}>
            {prob < 2 ? 'Siguiente problema →' : 'Terminar sesión'}
          </button>
        </div>
      )}
    </div>
  );
}

function ProgressTab() {
  return (
    <div data-screen-label="Practice web · Progress">
      <h2 style={{margin:'0 0 16px',fontSize:20}}>Mi progreso</h2>
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:14,padding:'0 16px'}}>
        {SKILLS.map(s=>{
          const c = pkColor(s.pk);
          return (
            <div key={s.key} className="pr-mastery-row">
              <span className="nm">{s.name}</span>
              <div className="bar"><span className="fill" style={{width:(s.pk*100)+'%',background:c}}/></div>
              <span style={{fontSize:12,fontFamily:'ui-monospace,monospace',fontWeight:700,color:c,width:36,textAlign:'right'}}>{(s.pk*100).toFixed(0)}%</span>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {[{l:'Racha actual',v:'4 días'},{l:'Esta semana',v:'47 ejerc.'},{l:'Correctas',v:'68%'},{l:'Habilidades',v:'4 / 6'}].map(s=>(
          <div key={s.l} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:14}}>
            <div style={{fontSize:12,color:'var(--fg-2)',textTransform:'uppercase',letterSpacing:'.04em',fontWeight:700}}>{s.l}</div>
            <div style={{fontSize:24,fontWeight:700,fontFamily:'ui-monospace,monospace',marginTop:4}}>{s.v}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function MeTab() {
  const ME = {name:'Antonia Fuentes',email:'antonia@stmaria.cl',role:'student',classroom:'4° A · Colegio San Pedro',id:'usr_a8f3b2c1'};
  return (
    <div data-screen-label="Practice web · Me">
      <h2 style={{margin:'0 0 16px',fontSize:20}}>Mi perfil · GET /auth/me</h2>
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:14,padding:20}}>
        <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:16}}>
          <div style={{width:60,height:60,borderRadius:9999,background:'var(--sky-100)',color:'var(--sky-700)',display:'grid',placeItems:'center',fontSize:22,fontWeight:700}}>AF</div>
          <div>
            <div style={{fontWeight:700,fontSize:18}}>{ME.name}</div>
            <span style={{padding:'3px 10px',borderRadius:9999,background:'var(--sky-100)',color:'var(--sky-800)',fontSize:11,fontWeight:700,textTransform:'uppercase'}}>alumno</span>
          </div>
        </div>
        <div style={{borderTop:'1px solid var(--border)',padding:'0 0 0'}}>
          {[{k:'Correo',v:ME.email},{k:'Curso',v:ME.classroom},{k:'ID',v:ME.id}].map(kv=>(
            <div key={kv.k} className="pr-me-kv"><span style={{color:'var(--fg-2)',fontWeight:600}}>{kv.k}</span><span style={{fontFamily:'ui-monospace,monospace',fontSize:13}}>{kv.v}</span></div>
          ))}
        </div>
        <div style={{marginTop:14,display:'flex',gap:10}}>
          <button className="btn btn-ghost" style={{flex:1}}><Icon name="settings" size={14}/> Ajustes</button>
          <button className="btn" style={{flex:1,background:'var(--mastery-weak)',color:'#fff',border:0}}>Cerrar sesión</button>
        </div>
      </div>
    </div>
  );
}

const TABS = [{id:'home',l:'Inicio'},{id:'progress',l:'Progreso'},{id:'me',l:'Mi perfil'}];

function App() {
  const [tab, setTab] = useState('home');
  const [practice, setPractice] = useState(null);
  return (
    <div>
      <nav className="pr-nav">
        <div className="pr-logo"><div className="mark">SP</div>Super<span style={{color:'var(--sky-500)'}}>Profes</span></div>
        <div className="pr-tabs">
          {TABS.map(t=><button key={t.id} className={`pr-tab ${tab===t.id&&!practice?'is-active':''}`} onClick={()=>{setTab(t.id);setPractice(null);}}>{t.l}</button>)}
        </div>
        <div className="pr-avatar">AF</div>
      </nav>
      <div className="pr-shell">
        {practice
          ? <PracticeTab skillKey={practice} onBack={()=>setPractice(null)}/>
          : tab==='home'     ? <HomeTab onPractice={sk=>setPractice(sk)} onScan={()=>alert('OCR: POST /attempts/ocr-extract')}/>
          : tab==='progress' ? <ProgressTab/>
          : <MeTab/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
