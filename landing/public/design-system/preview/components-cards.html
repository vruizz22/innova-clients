<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Stat card with header zone, badges, deltas" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"/><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card .head .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-2); font-weight: 600; }
  .stat { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .delta { font-size: 13px; color: var(--mint-700); font-weight: 600; }
  .badge { background: var(--error-bg); color: var(--error-fg); padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="head">
        <span class="label">Mastery promedio</span>
        <span class="badge" style="background:var(--success-bg);color:var(--success-fg)">+4%</span>
      </div>
      <div class="stat">0.68</div>
      <div class="t-caption" style="margin-top:6px">vs. 0.65 hace 7 días</div>
    </div>
    <div class="card">
      <div class="head">
        <span class="label">Alertas sin resolver</span>
        <span class="badge">3 nuevas</span>
      </div>
      <div class="stat">12</div>
      <div class="t-caption" style="margin-top:6px">9 AT_RISK · 3 STUDENT_DROP</div>
    </div>
  </div>
</body></html>
