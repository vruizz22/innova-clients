<!doctype html>
<!-- @dsCard group="Type" name="Math typography (.math)" subtitle="Tabular + slashed-zero for vertical math" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8"/><title>Math typography</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .panel { border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .panel h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-2); }
  .vstack { font-family: var(--font-math); font-size: 36px; font-weight: 600; line-height: 1.1; text-align: right; }
  .vstack .row { padding: 2px 8px; }
  .vstack .op { display: inline-block; width: 16px; text-align: left; }
  .vstack hr { border: 0; border-top: 2px solid var(--fg-1); margin: 4px 0; }
  .bad .vstack { letter-spacing: 0; font-variant-numeric: normal; }
</style></head>
<body>
  <div class="grid">
    <div class="panel">
      <h3>With <code>.math</code> · tabular + slashed zero</h3>
      <div class="vstack math">
        <div class="row">7&nbsp;0&nbsp;3</div>
        <div class="row"><span class="op">−</span>2&nbsp;0&nbsp;6</div>
        <hr/>
        <div class="row">4&nbsp;9&nbsp;7</div>
      </div>
      <p class="t-caption" style="margin-top:8px">Columns line up. Zeros are unambiguous.</p>
    </div>
    <div class="panel bad">
      <h3>Without · proportional figures</h3>
      <div class="vstack">
        <div class="row">7 0 3</div>
        <div class="row"><span class="op">−</span>2 0 6</div>
        <hr/>
        <div class="row">4 9 7</div>
      </div>
      <p class="t-caption" style="margin-top:8px">Don't ship this. Misalignment confuses 8-year-olds.</p>
    </div>
  </div>
</body></html>
