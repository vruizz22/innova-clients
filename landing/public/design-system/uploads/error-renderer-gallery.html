<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"/>
<title>SuperProfes · Visual Error Renderer</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../shared.css"/>
<link rel="stylesheet" href="../shared/VisualErrorRenderer.css"/>
<style>
  body { padding: 32px; background: var(--bg-subtle); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; max-width: 1280px; margin-left: auto; margin-right: auto; }
  .lede { color: var(--fg-2); margin: 0 auto 24px; max-width: 1280px; }
</style>
</head>
<body>
<h1>Visual Error Renderer</h1>
<p class="lede">Cada slug de la taxonomía mapea a una explicación amistosa en español + diff lado-a-lado.</p>
<div id="root" class="gallery"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/VisualErrorRenderer.jsx"></script>
<script type="text/babel">
const slugs = Object.keys(window.ERROR_LIBRARY);
ReactDOM.createRoot(document.getElementById('root')).render(
  <>{slugs.map(s => <VisualErrorRenderer key={s} slug={s}/>)}</>
);
</script>
</body>
</html>
