<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Radii & shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .demo { background: #fff; border: 1px solid var(--border); height: 70px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--fg-2); font-weight: 600; }
  .grp + .grp { margin-top: 18px; }
  h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-2); margin: 0 0 10px; }
  .pop { box-shadow: var(--shadow-pop); border: 1px solid var(--border); }
  .card-s { box-shadow: var(--shadow-card); border: 1px solid var(--border); }
</style></head>
<body>
  <div class="grp">
    <h4>Radii</h4>
    <div class="row">
      <div class="demo" style="border-radius:4px">r-sm · 4</div>
      <div class="demo" style="border-radius:8px">r-md · 8</div>
      <div class="demo" style="border-radius:12px">r-lg · 12</div>
      <div class="demo" style="border-radius:16px">r-xl · 16</div>
      <div class="demo" style="border-radius:9999px">pill</div>
    </div>
  </div>
  <div class="grp">
    <h4>Shadows</h4>
    <div class="row">
      <div class="demo card-s" style="border-radius:12px">card · resting</div>
      <div class="demo pop" style="border-radius:12px">pop · overlay</div>
      <div class="demo" style="border-radius:12px">none · flat</div>
    </div>
  </div>
</body></html>
