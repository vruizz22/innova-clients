<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18506D"/>
      <stop offset="0.55" stop-color="#0F2F45"/>
      <stop offset="1" stop-color="#0A1A2A"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FA7D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3FA7D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DAA72" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3DAA72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="320" fill="url(#glowSky)"/>
  <circle cx="180" cy="640" r="300" fill="url(#glowMint)"/>

  <!-- Brand wordmark (inverse) -->
  <g transform="translate(80 84)">
    <g transform="translate(0 6)">
      <rect x="0" y="0" width="46" height="9" rx="4.5" fill="#FFFFFF"/>
      <rect x="0" y="17" width="32" height="9" rx="4.5" fill="#FFFFFF" opacity="0.72"/>
      <rect x="0" y="34" width="40" height="9" rx="4.5" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <text x="74" y="40" font-weight="700" font-size="40" letter-spacing="-0.025em" fill="#FFFFFF">Super<tspan fill="#7DD3FC">Profes</tspan></text>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(80 224)">
    <rect x="0" y="0" width="404" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="26" cy="22" r="5" fill="#5EEAD4"/>
    <text x="44" y="29" font-weight="600" font-size="17" letter-spacing="0.01em" fill="#CDEAF5">Diagnóstico matemático · 3° a 6° básico</text>
  </g>

  <!-- Headline -->
  <text x="80" y="356" font-weight="700" font-size="74" letter-spacing="-0.03em" fill="#FFFFFF">Detecta el error</text>
  <text x="80" y="438" font-weight="700" font-size="74" letter-spacing="-0.03em" fill="#FFFFFF">antes de la prueba.</text>

  <!-- Subline -->
  <text x="80" y="500" font-weight="400" font-size="26" letter-spacing="0" fill="#A9C5D6">Ve qué procedimiento falla cada alumno y asigna práctica dirigida.</text>

  <!-- Footer domain -->
  <text x="80" y="582" font-weight="600" font-size="22" letter-spacing="0.01em" fill="#7DD3FC">superprofes.app</text>
</svg>
